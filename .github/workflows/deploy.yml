# Build Toledot (the data bundle, the timeline and the journey) and publish site/ to Cloudflare Pages.
# Runs on every push to main, and by hand from the Actions tab.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit) and CLOUDFLARE_ACCOUNT_ID.
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  PAGES_PROJECT: toledot

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the data pipeline
        run: pip install -e ".[dev]"
      - name: Test the data
        run: python -m pytest -q
      - name: Build the data bundle (site/data)
        run: python -m bible_timeline site

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: journey/package-lock.json
      # the raw Poly Haven downloads (skies, textures, scans) are kept between runs
      - uses: actions/cache@v4
        with:
          path: journey/.cache
          key: polyhaven-${{ hashFiles('journey/src/kit/assets-manifest.js', 'journey/scripts/fetch-assets.mjs') }}
          restore-keys: polyhaven-
      - name: Install the journey
        working-directory: journey
        run: npm ci
      - name: Build the journey (site/index.html, site/assets, site/lib)
        working-directory: journey
        run: npm run build
      - name: Test the timeline and the KJV captions
        run: node --test site/timeline/tests/layout.test.mjs journey/tests/story.test.mjs

      - name: Create the Pages project (first run only)
        run: npx --yes wrangler@4 pages project create "$PAGES_PROJECT" --production-branch=main || echo "project already exists"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy site --project-name=${{ env.PAGES_PROJECT }} --branch=main --commit-dirty=true
