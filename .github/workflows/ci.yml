# Test and build Toledot on every push (the data, the timeline and the journey). Publishing is done by
# Cloudflare Pages, which is connected to this repository and builds site/ itself (see README "Deploy").
name: Test and build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the data pipeline
        run: pip install -e ".[dev]"
      - name: Test the data
        run: python -m pytest -q
      - name: Build the data bundle (site/data)
        run: python -m bible_timeline site

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: journey/package-lock.json
      # the raw Poly Haven downloads (skies, textures, scans) are kept between runs
      - uses: actions/cache@v4
        with:
          path: journey/.cache
          key: polyhaven-${{ hashFiles('journey/src/kit/assets-manifest.js', 'journey/scripts/fetch-assets.mjs') }}
          restore-keys: polyhaven-
      - name: Install the journey
        working-directory: journey
        run: npm ci
      - name: Build the journey (site/index.html, site/assets, site/lib)
        working-directory: journey
        run: npm run build
      - name: Test the timeline and the KJV captions
        run: node --test site/timeline/tests/layout.test.mjs journey/tests/story.test.mjs
