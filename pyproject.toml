[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bible-timeline"
version = "0.1.0"
description = "Evidence-aware biblical chronology data pipeline"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0,<7",
    "jsonschema>=4.23,<5",
]

[project.scripts]
bible-timeline = "bible_timeline.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
