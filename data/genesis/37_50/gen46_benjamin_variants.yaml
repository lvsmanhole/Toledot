records:
  - {id: gera-gen46-benjamin-line-variant, subject_id: gera, object_id: benjamin, predicate: parent_reference, value: {kind: parent_reference, parent: benjamin, status: listed among Benjamin's sons in the Masoretic text}, evidence_type: explicit_text, witness_id: mt-genesis-bhs, confidence: A, interpretation_note: "Masoretic Genesis 46:21 lists this name among Benjamin's sons; the Septuagint of the same verse presents Gera, Naaman, Ehi (Anchis), Rosh, Muppim, and Huppim as sons of Bela and Ard as son of Gera. No parent relationship is asserted while the witnesses disagree.", citations: [{source_id: bhs-genesis, locator: "Genesis 46:21", witness_id: mt-genesis-bhs}, {source_id: goettingen-genesis-1974, locator: "Genesis 46:21", witness_id: lxx-genesis-goettingen}]}
