schema_version: 1
record_type: entities
records:
  - {id: elder-judge-susanna-1, entity_type: human, primary_name: "First elder (mastick tree)", classification: unnamed_person, identity_status: unnamed_unique, aliases: [], gender: male, description: "One of the two lecherous elder-judges; questioned first by Daniel, he names a mastick tree.", identity_note: "The two elders are never named; refs before 13:52 (and 13:61-62) refer to both jointly. 13:50 'the elders' are the assembly's elders, not these two. Executed 13:62.", citations: [{source_id: world-english-bible, locator: "Susanna 13:5", witness_id: web-susanna}]}
  - {id: elder-judge-susanna-2, entity_type: human, primary_name: "Second elder (evergreen oak)", classification: unnamed_person, identity_status: unnamed_unique, aliases: [], gender: male, description: "The other lecherous elder-judge; questioned second by Daniel, he names an evergreen oak.", identity_note: "Called 'seed of Canaan, and not of Judah' (13:56) as an insult, not a genealogy.", citations: [{source_id: world-english-bible, locator: "Susanna 13:5", witness_id: web-susanna}]}
  - {id: hilkiah-father-of-susanna, entity_type: human, primary_name: "Helkias", classification: named_person, identity_status: named, aliases: ["Hilkiah"], gender: male, description: "Father of Susanna.", identity_note: "Greek form of Hilkiah; nothing links him to any Hebrew-Bible Hilkiah.", citations: [{source_id: world-english-bible, locator: "Susanna 13:2", witness_id: web-susanna}]}
  - {id: joakim-husband-of-susanna, entity_type: human, primary_name: "Joakim", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Wealthy Jew of Babylon, husband of Susanna.", identity_note: "Not King Jehoiakim/Jehoiachin nor the high priest Joakim of Baruch 1:7; a private man of the exile.", citations: [{source_id: world-english-bible, locator: "Susanna 13:1", witness_id: web-susanna}]}
  - {id: mother-of-susanna, entity_type: human, primary_name: "Susanna's mother", classification: unnamed_person, identity_status: unnamed_unique, aliases: [], gender: female, description: "Unnamed mother of Susanna, wife of Helkias.", citations: [{source_id: world-english-bible, locator: "Susanna 13:30", witness_id: web-susanna}]}
  - {id: susanna-person, entity_type: human, primary_name: "Susanna", classification: named_person, identity_status: named, aliases: [], gender: female, description: "Virtuous Jewish wife in Babylon falsely accused by two elders and vindicated by Daniel.", citations: [{source_id: world-english-bible, locator: "Susanna 13:2", witness_id: web-susanna}]}
