schema_version: 1
record_type: entities
records:
  - {id: abram-father-of-edna, entity_type: human, primary_name: "’Abrâm", classification: named_person, identity_status: named, aliases: ["Abram (the elder)"], gender: male, description: "Father of Edna, the wife of Terah; Abram was named after him; died before his grandson was born.", identity_note: "Charles distinguishes the spelling ’Abrâm here.", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 11:14", witness_id: charles-jubilees-translation}]}
  - {id: ada-wife-of-reuben, entity_type: human, primary_name: "’Adâ", classification: named_person, identity_status: named, aliases: ["Ada"], gender: female, description: "Wife of Reuben.", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 34:20", witness_id: charles-jubilees-translation}]}
  - {id: adibaa-wife-of-simeon, entity_type: human, primary_name: "’Adîbâ’a", classification: named_person, identity_status: named, aliases: ["Adibaa"], gender: female, description: "Canaanite wife of Simeon.", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 34:20", witness_id: charles-jubilees-translation}]}
  - {id: adoran-the-aramaean, entity_type: human, primary_name: "’Adôrân", classification: named_person, identity_status: named, aliases: ["Adoran"], gender: male, description: "An Aramaean ally of Esau's sons, shot dead by Jacob.", identity_note: "Possibly the same as ’Adurâm \"the friend of their father\" (37:9), but 37:9 may be a place (cf. the hill \"in ’Adûrâm\", 38:8-9); not merged.", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 38:3", witness_id: charles-jubilees-translation}]}
  - {id: asudi-son-of-dan, entity_type: human, primary_name: "Asûdî", classification: named_person, identity_status: named, aliases: ["Asudi"], gender: male, description: "Son of Dan. Died in the year of entry into Egypt (44:29).", identity_note: "Not in Genesis 46.", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 44:28", witness_id: charles-jubilees-translation}]}
  - {id: azrial, entity_type: human, primary_name: "Âzrîâl", classification: named_person, identity_status: named, aliases: ["Azrial"], gender: male, description: "Father of Edna, the wife of Methuselah.", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 4:27", witness_id: charles-jubilees-translation}]}
  - {id: azura-seth-wife, entity_type: human, primary_name: "Azûrâ", classification: named_person, identity_status: named, aliases: ["Azura"], gender: female, description: "Daughter of Adam and Eve who became the wife of her brother Seth.", identity_note: "4:8 \"he begat his daughter Azura\" (Adam); Eve as mother is implied by context (4:7-8).", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 4:8", witness_id: charles-jubilees-translation}]}
  - {id: azurad, entity_type: human, primary_name: "’Azûrâd", classification: named_person, identity_status: named, aliases: ["Azurad"], gender: female, description: "Wife of Eber, daughter of Nebrod; mother of Peleg.", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 8:7", witness_id: charles-jubilees-translation}]}
  - {id: baraka-jared-wife, entity_type: human, primary_name: "Bâraka", classification: named_person, identity_status: named, aliases: ["Baraka"], gender: female, description: "Wife of Jared, daughter of Rasujal; mother of Enoch.", identity_note: "Described as \"a daughter of his father's brother\" (Jared's cousin).", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 4:16", witness_id: charles-jubilees-translation}]}
  - {id: barakiel-father-of-dinah, entity_type: human, primary_name: "Barâkî’êl", classification: named_person, identity_status: named, aliases: ["Barakiel"], gender: male, description: "Father of Dinah, the wife of Mahalalel; a brother of Kenan by implication.", identity_note: "Distinct from Bârâkî’îl, father of Betenos (4:28), who lived generations later.", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 4:15", witness_id: charles-jubilees-translation}]}
  - {id: barakiil-father-of-betenos, entity_type: human, primary_name: "Bârâkî’îl", classification: named_person, identity_status: named, aliases: ["Barakiil"], gender: male, description: "Father of Betenos, the wife of Lamech.", identity_note: "Not the same man as Barakiel father of Dinah (4:15); generations apart.", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 4:28", witness_id: charles-jubilees-translation}]}
  - {id: danel-father-of-edni, entity_type: human, primary_name: "Dânêl", classification: named_person, identity_status: named, aliases: ["Danel"], gender: male, description: "Father of Edni, the wife of Enoch; a brother of Jared by implication.", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 4:20", witness_id: charles-jubilees-translation}]}
  - {id: dinah-wife-of-mahalalel, entity_type: human, primary_name: "Dînâh", classification: named_person, identity_status: named, aliases: ["Dinah"], gender: female, description: "Wife of Mahalalel, daughter of Barakiel; mother of Jared.", identity_note: "Described as \"the daughter of his father's brother\" (Mahalalel's first cousin), so Barakiel was a brother of Kenan; Barakiel's own parents are not named.", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 4:15", witness_id: charles-jubilees-translation}]}
  - {id: edna-methuselah-wife, entity_type: human, primary_name: "Ednâ", classification: named_person, identity_status: named, aliases: ["Edna"], gender: female, description: "Wife of Methuselah, daughter of Azrial; mother of Lamech.", identity_note: "Described as daughter of \"his father's brother\".", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 4:27", witness_id: charles-jubilees-translation}]}
  - {id: edna-wife-of-terah, entity_type: human, primary_name: "’Êdnâ", classification: named_person, identity_status: named, aliases: ["Edna"], gender: female, description: "Wife of Terah, daughter of ’Abrâm; mother of Abram.", identity_note: "11:14: \"the daughter of his father's sister\" (Terah's cousin).", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 11:14", witness_id: charles-jubilees-translation}]}
  - {id: egla-wife-of-dan, entity_type: human, primary_name: "’Êglâ", classification: named_person, identity_status: named, aliases: ["Egla"], gender: female, description: "Wife of Dan.", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 34:20", witness_id: charles-jubilees-translation}]}
  - {id: haran-wife-jub, entity_type: human, primary_name: "Wife of Haran", classification: unnamed_person, identity_status: unnamed_unique, aliases: [], gender: female, description: "Unnamed wife of Haran and mother of Lot.", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 12:10", witness_id: charles-jubilees-translation}]}
  - {id: hezaqa-wife-of-issachar, entity_type: human, primary_name: "Hêzaqâ", classification: named_person, identity_status: named, aliases: ["Hezaqa"], gender: female, description: "Wife of Issachar.", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 34:20", witness_id: charles-jubilees-translation}]}
  - {id: ijaka-son-of-dan, entity_type: human, primary_name: "’Îjâka", classification: named_person, identity_status: named, aliases: ["Ijaka"], gender: male, description: "Son of Dan. Died in the year of entry into Egypt (44:29).", identity_note: "Not in Genesis 46.", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 44:28", witness_id: charles-jubilees-translation}]}
  - {id: ijasaka-wife-of-benjamin, entity_type: human, primary_name: "’Îjasaka", classification: named_person, identity_status: named, aliases: ["Ijasaka"], gender: female, description: "Wife of Benjamin.", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 34:20", witness_id: charles-jubilees-translation}]}
  - {id: ijaska, entity_type: human, primary_name: "’Îjâskâ", classification: named_person, identity_status: named, aliases: ["Ijaska"], gender: female, description: "Wife of Nahor, daughter of Nestag of the Chaldees; mother of Terah.", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 11:9", witness_id: charles-jubilees-translation}]}
  - {id: ijona-wife-of-asher, entity_type: human, primary_name: "’Îjônâ", classification: named_person, identity_status: named, aliases: ["Ijôna"], gender: female, description: "Wife of Asher.", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 34:20", witness_id: charles-jubilees-translation}]}
  - {id: ishmael-wife-egyptian, entity_type: human, primary_name: "Wife of Ishmael", classification: unnamed_person, identity_status: unnamed_unique, aliases: [], gender: female, description: "Egyptian woman chosen by Hagar as Ishmael's wife; mother of Nebaioth.", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 17:13", witness_id: charles-jubilees-translation}]}
  - {id: iv-son-of-naphtali, entity_type: human, primary_name: "‘Îv", classification: named_person, identity_status: named, aliases: ["Iv"], gender: male, description: "Son of Naphtali. Born after the famine years, died in Egypt (44:31).", identity_note: "Not in Genesis 46.", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 44:30", witness_id: charles-jubilees-translation}]}
  - {id: kaber, entity_type: human, primary_name: "Kâbêr", classification: named_person, identity_status: named, aliases: ["Kaber"], gender: male, description: "Father of Melka, the wife of Serug.", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 11:7", witness_id: charles-jubilees-translation}]}
  - {id: kesed-brother-of-kainam, entity_type: human, primary_name: "Kêsêd", classification: named_person, identity_status: named, aliases: ["Kesed"], gender: male, description: "Brother of Kainam (by 8:6 \"his father's brother\"); father of Mu'ak and of Ur.", identity_note: "Not identical with Chesed son of Nahor (Gen 22:22). His own parentage (Arpachshad) is implied, not stated.", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 8:6", witness_id: charles-jubilees-translation}]}
  - {id: king-of-egypt-slain-by-makamaron, entity_type: human, primary_name: "King of Egypt slain by Makamaron", classification: unnamed_person, identity_status: unnamed_unique, aliases: [], gender: male, description: "Egyptian king killed in battle by Makamaron of Canaan after Joseph's death.", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 46:6", witness_id: charles-jubilees-translation}]}
  - {id: lomna, entity_type: human, primary_name: "Lômnâ", classification: named_person, identity_status: named, aliases: ["Lomna"], gender: female, description: "Wife of Peleg, daughter of Sinaar; mother of Reu.", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 10:18", witness_id: charles-jubilees-translation}]}
  - {id: madai-wife-jub, entity_type: human, primary_name: "Wife of Madai", classification: unnamed_person, identity_status: unnamed_unique, aliases: [], gender: female, description: "Wife of Madai; sister of Arpachshad (hence a daughter of Shem by implication).", identity_note: "10:35 calls Arpachshad \"his wife's brother\"; she is not named.", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 10:35", witness_id: charles-jubilees-translation}]}
  - {id: maka-wife-of-gad, entity_type: human, primary_name: "Mâka", classification: named_person, identity_status: named, aliases: ["Maka"], gender: female, description: "Wife of Gad.", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 34:20", witness_id: charles-jubilees-translation}]}
  - {id: makamaron-king-of-canaan, entity_type: human, primary_name: "Mâkamârôn", classification: named_person, identity_status: named, aliases: ["Makamaron"], gender: male, description: "King of Canaan who, from Assyria, defeated and killed the king of Egypt.", identity_note: "46:9 and 46:11 speak of \"the king of Canaan\"; identity with Makamaron assumed from context.", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 46:6", witness_id: charles-jubilees-translation}]}
  - {id: melka-wife-of-kainam, entity_type: human, primary_name: "Mêlkâ", classification: named_person, identity_status: named, aliases: ["Melka"], gender: female, description: "Wife of Kainam, daughter of Madai son of Japheth; mother of Shelah.", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 8:5", witness_id: charles-jubilees-translation}]}
  - {id: melka-wife-of-levi, entity_type: human, primary_name: "Mêlkâ", classification: named_person, identity_status: named, aliases: ["Melka"], gender: female, description: "Wife of Levi, of the daughters of Aram, of the seed of Terah.", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 34:20", witness_id: charles-jubilees-translation}]}
  - {id: melka-wife-of-serug, entity_type: human, primary_name: "Mêlkâ", classification: named_person, identity_status: named, aliases: ["Melka"], gender: female, description: "Wife of Serug, daughter of Kaber; mother of Nahor.", identity_note: "Described as daughter of \"his father's brother\".", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 11:7", witness_id: charles-jubilees-translation}]}
  - {id: muak, entity_type: human, primary_name: "Mû’ak", classification: named_person, identity_status: named, aliases: ["Muak"], gender: female, description: "Wife of Shelah, daughter of Kesed; mother of Eber.", identity_note: "Kesed is called \"his father's brother\" (Shelah's uncle).", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 8:6", witness_id: charles-jubilees-translation}]}
  - {id: mualeleth-kenan-wife, entity_type: human, primary_name: "Mûalêlêth", classification: named_person, identity_status: named, aliases: ["Mualeleth"], gender: female, description: "Wife of Kenan, called his sister; mother of Mahalalel.", identity_note: "Text calls her \"his sister\" (Kenan's); no parent named.", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 4:14", witness_id: charles-jubilees-translation}]}
  - {id: nebrod-father-of-azurad, entity_type: human, primary_name: "Nêbrôd", classification: named_person, identity_status: named, aliases: ["Nebrod"], gender: male, description: "Father of Azurad, the wife of Eber.", identity_note: "Nebrod is the Greek form of Nimrod, but Jubilees gives no further identification (no link to Cush); kept separate from nimrod.", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 8:7", witness_id: charles-jubilees-translation}]}
  - {id: nestag, entity_type: human, primary_name: "Nêstâg", classification: named_person, identity_status: named, aliases: ["Nestag"], gender: male, description: "A Chaldean, father of Ijaska the wife of Nahor.", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 11:9", witness_id: charles-jubilees-translation}]}
  - {id: niiman-wife-of-zebulun, entity_type: human, primary_name: "Nî’îmân", classification: named_person, identity_status: named, aliases: ["Niiman"], gender: female, description: "Wife of Zebulon.", identity_note: "Name marked corrupt by Charles (†Nî’îmân†).", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 34:20", witness_id: charles-jubilees-translation}]}
  - {id: noam-enosh-wife, entity_type: human, primary_name: "Nôâm", classification: named_person, identity_status: named, aliases: ["Noam"], gender: female, description: "Wife of Enos, called his sister; mother of Kenan.", identity_note: "Text calls her \"his sister\" (Enos's), i.e. a daughter of Seth, but no parent is named.", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 4:13", witness_id: charles-jubilees-translation}]}
  - {id: ora-wife-of-reu, entity_type: human, primary_name: "’Ôrâ", classification: named_person, identity_status: named, aliases: ["Ora"], gender: female, description: "Wife of Reu, daughter of Ur son of Kesed; mother of Serug.", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 11:1", witness_id: charles-jubilees-translation}]}
  - {id: rakeel-father-of-emzara, entity_type: human, primary_name: "Râkê’êl", classification: named_person, identity_status: named, aliases: ["Rakeel"], gender: male, description: "Father of Emzara, the wife of Noah.", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 4:33", witness_id: charles-jubilees-translation}]}
  - {id: rasueja, entity_type: human, primary_name: "Râsû’ĕjâ", classification: named_person, identity_status: named, aliases: ["Rasueja"], gender: female, description: "Wife of Arpachshad, daughter of Elam; mother of Kainam.", identity_note: "Text: \"Râsû’ĕjâ, [the daughter of Sûsân,] the daughter of Elam\". Charles brackets \"the daughter of Sûsân\"; Sûsân (Susa) appears elsewhere only as a place (8:21, 9:2), so it is not entered as a person. Elam is taken as her father; if the bracketed words are original he would be her grandfather.", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 8:1", witness_id: charles-jubilees-translation}]}
  - {id: rasujal, entity_type: human, primary_name: "Râsûjâl", classification: named_person, identity_status: named, aliases: ["Rasujal"], gender: male, description: "Father of Baraka, the wife of Jared; a brother of Mahalalel by implication.", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 4:16", witness_id: charles-jubilees-translation}]}
  - {id: rasuu-wife-of-naphtali, entity_type: human, primary_name: "Rasû’û", classification: named_person, identity_status: named, aliases: ["Rasuu"], gender: female, description: "Wife of Naphtali, from Mesopotamia.", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 34:20", witness_id: charles-jubilees-translation}]}
  - {id: salomon-son-of-dan, entity_type: human, primary_name: "Salômôn", classification: named_person, identity_status: named, aliases: ["Salomon"], gender: male, description: "Son of Dan. Died in the year of entry into Egypt (44:29).", identity_note: "Not in Genesis 46.", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 44:28", witness_id: charles-jubilees-translation}]}
  - {id: samon-son-of-dan, entity_type: human, primary_name: "Sâmôn", classification: named_person, identity_status: named, aliases: ["Samon"], gender: male, description: "Son of Dan. Died in the year of entry into Egypt (44:29).", identity_note: "Not in Genesis 46 (Dan has only Hushim there).", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 44:28", witness_id: charles-jubilees-translation}]}
  - {id: simeon-second-wife-jub, entity_type: human, primary_name: "Second wife of Simeon", classification: unnamed_person, identity_status: unnamed_unique, aliases: [], gender: female, description: "Simeon's second wife, taken from Mesopotamia after he repented.", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 34:21", witness_id: charles-jubilees-translation}]}
  - {id: sinaar-father-of-lomna, entity_type: human, primary_name: "Sînâ’ar", classification: named_person, identity_status: named, aliases: ["Sinaar"], gender: male, description: "Father of Lomna, the wife of Peleg.", identity_note: "The name resembles Shinar, but here it is a person.", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 10:18", witness_id: charles-jubilees-translation}]}
  - {id: ur-son-of-kesed, entity_type: human, primary_name: "’Ûr", classification: named_person, identity_status: named, aliases: ["Ur"], gender: male, description: "Son of Kesed; builder of the city ’Arâ of the Chaldees; father of Ora.", identity_note: "11:3: he built ’Arâ of the Chaldees and named it after himself and his father. \"Ur of the Chaldees\" (city) is not counted.", citations: [{source_id: charles-jubilees-1917, locator: "Jubilees 11:1", witness_id: charles-jubilees-translation}]}
