  - {id: sostratus, entity_type: human, primary_name: "Sostratus", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Commander of the Jerusalem citadel responsible for collecting revenues.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 4:27", witness_id: web-2-maccabees}]}
