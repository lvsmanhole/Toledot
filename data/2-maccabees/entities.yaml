  - {id: timotheus-2ma-a, entity_type: human, primary_name: "Timotheus", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Enemy commander defeated by Judas, killed hiding in a cistern at Gazara.", identity_note: "Killed in 10:37, yet a Timotheus is active again in ch. 12; treated as two entries (timotheus-2ma-b for ch. 12). 2MA is not strictly chronological, so they may be the same person narrated out of order.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 8:30", witness_id: web-2-maccabees}]}
