records:
  - {id: absalom-envoy-2ma11, entity_type: human, primary_name: "Absalom", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Jewish envoy to Lysias.", identity_note: "Not David's son Absalom. Possibly the Absalom named as a father in 1 Macc 11:70, 13:11; not stated.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 11:17", witness_id: web-2-maccabees}]}
  - {id: andronicus-deputy-2ma4, entity_type: human, primary_name: "Andronicus", classification: named_person, identity_status: named, aliases: [], gender: male, description: "High-ranking deputy of Antiochus IV who murdered Onias and was executed for it.", identity_note: "Executed in 4:38, so distinct from Andronicus the governor at Gerizim (5:23).", citations: [{source_id: world-english-bible, locator: "2 Maccabees 4:31", witness_id: web-2-maccabees}]}
  - {id: andronicus-gerizim, entity_type: human, primary_name: "Andronicus", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Governor left at Gerizim by Antiochus IV.", identity_note: "Distinct from the Andronicus executed in 4:38.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 5:23", witness_id: web-2-maccabees}]}
  - {id: antiochis-concubine, entity_type: human, primary_name: "Antiochis", classification: named_person, identity_status: named, aliases: [], gender: female, description: "Concubine of Antiochus IV to whom Tarsus and Mallus were given.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 4:30", witness_id: web-2-maccabees}]}
  - {id: apollonius-mysarch, entity_type: human, primary_name: "Apollonius", classification: named_person, identity_status: named, aliases: [], gender: male, description: "'Lord of pollutions' sent with 22,000 men who massacred Jerusalemites on the Sabbath.", identity_note: "Greek 'Mysarch' (commander of Mysian troops) Apollonius; distinct from the governors of chs. 3-4 and from Apollonius son of Gennaeus (12:2).", citations: [{source_id: world-english-bible, locator: "2 Maccabees 5:24", witness_id: web-2-maccabees}]}
  - {id: apollonius-of-tarsus, entity_type: human, primary_name: "Apollonius of Tarsus", classification: named_person, identity_status: named, aliases: ["Apollonius", "Appolonius"], gender: male, description: "Governor of Coelesyria and Phoenicia to whom Simon reported the temple treasury.", identity_note: "Greek manuscripts read 'Apollonius son of Thraseas'; WEB renders 'of Tarsus'. Possibly the same as Apollonius son of Menestheus (4:4), who holds the same governorship, but the patronymics differ, so kept separate. 4MA 4:2-14 retells this episode with Apollonius himself entering the temple; mapped to this id in 4MA. 4MA's retelling of 2MA 3 gives Apollonius the role played by Heliodorus in 2MA; mapped to the governor of 2MA 3:5 (apollonius-of-tarsus).", citations: [{source_id: world-english-bible, locator: "2 Maccabees 3:5", witness_id: web-2-maccabees}]}
  - {id: apollonius-son-of-gennaeus, entity_type: human, primary_name: "Apollonius son of Gennaeus", classification: named_person, identity_status: named, aliases: [], gender: male, description: "District governor who would not let the Jews live in peace.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 12:2", witness_id: web-2-maccabees}]}
  - {id: apollonius-son-of-menestheus, entity_type: human, primary_name: "Apollonius son of Menestheus", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Governor of Coelesyria and Phoenicia, sent to Egypt for Philometor's enthronement.", identity_note: "See identity_note on Apollonius of Tarsus.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 4:4", witness_id: web-2-maccabees}]}
  - {id: apollophanes, entity_type: human, primary_name: "Apollophanes", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Killed with Timotheus and Chaereas at Gazara.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 10:37", witness_id: web-2-maccabees}]}
  - {id: aretas-arabian-prince, entity_type: human, primary_name: "Aretas", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Prince of the Arabians at whose court Jason was imprisoned.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 5:8", witness_id: web-2-maccabees}]}
  - {id: aristobulus-teacher-of-ptolemy, entity_type: human, primary_name: "Aristobulus", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Teacher of King Ptolemy, of priestly descent, addressee of the second prefatory letter.", identity_note: "Traditionally identified with the Jewish philosopher Aristobulus of Alexandria.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 1:10", witness_id: web-2-maccabees}]}
  - {id: bacchides-2ma8, entity_type: human, primary_name: "Bacchides", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Commander whose forces were defeated with those of Timotheus.", identity_note: "Possibly the Bacchides of 1 Macc 7, but not clearly identified here.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 8:30", witness_id: web-2-maccabees}]}
  - {id: bacenor, entity_type: human, primary_name: "Bacenor", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Leader of a company in Judas' army.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 12:35", witness_id: web-2-maccabees}]}
  - {id: callisthenes, entity_type: human, primary_name: "Callisthenes", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Man who had set the sacred gates on fire, burned in a little house.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 8:33", witness_id: web-2-maccabees}]}
  - {id: chaereas, entity_type: human, primary_name: "Chaereas", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Commander of Gazara and brother of Timotheus, killed there.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 10:32", witness_id: web-2-maccabees}]}
  - {id: crates, entity_type: human, primary_name: "Crates", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Commander over the Cyprians, left as deputy by Sostratus.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 4:29", witness_id: web-2-maccabees}]}
  - {id: demophon, entity_type: human, primary_name: "Demophon", classification: named_person, identity_status: named, aliases: [], gender: male, description: "District governor hostile to the Jews.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 12:2", witness_id: web-2-maccabees}]}
  - {id: dositheus-captain-2ma12, entity_type: human, primary_name: "Dositheus", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Captain under Judas who destroyed Timotheus' garrison.", identity_note: "Distinct from Dositheus of Bacenor's company (12:35) and Dositheus of 3MA.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 12:19", witness_id: web-2-maccabees}]}
  - {id: dositheus-of-bacenor, entity_type: human, primary_name: "Dositheus", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Horseman of Bacenor's company who nearly captured Gorgias.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 12:35", witness_id: web-2-maccabees}]}
  - {id: eleazar-2ma8, entity_type: human, primary_name: "Eleazer", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Read the sacred book aloud and led the first band against Nicanor.", identity_note: "Probably Eleazar (Avaran) brother of Judas (1 Macc 2:5), but 2MA does not call him a brother and the Greek text is uncertain here (some witnesses read 'Esdris'). Kept separate; distinct from Eleazar the martyr.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 8:23", witness_id: web-2-maccabees}]}
  - {id: eleazar-martyr, entity_type: human, primary_name: "Eleazar", classification: named_person, identity_status: named, aliases: ["the man of ninety years", "father Eleazar", "an aged priest"], gender: male, description: "Aged principal scribe who chose death rather than eat swine's flesh.", identity_note: "Merged with the Eleazar of 4 Maccabees 5-7 (same martyrdom; 4MA calls him a priest and lawyer); same new_id used in 4MA. Distinct from the priest Eleazar of 3MA 6 and from Eleazar of 2MA 8:23. Same martyr as Eleazar of 2MA 6:18-31 (2MA calls him a scribe aged 90); same new_id used in 2MA. No age is stated in 4MA. Distinct from Eleazar the priest of 3MA. Called 'the descendant of Aaron' (7:12): priestly descent, not a parent.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 6:18", witness_id: web-2-maccabees}]}
  - {id: esdris, entity_type: human, primary_name: "Esdris", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Leader of a Jewish force wearied in the battle against Gorgias.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 12:36", witness_id: web-2-maccabees}]}
  - {id: gennaeus, entity_type: human, primary_name: "Gennaeus", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Father of Apollonius.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 12:2", witness_id: web-2-maccabees}]}
  - {id: hauran-2ma4, entity_type: human, primary_name: "Hauran", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Aged man who led Lysimachus' armed force.", identity_note: "Personal name (some translations 'Auranus'); not the region Hauran.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 4:40", witness_id: web-2-maccabees}]}
  - {id: hegemonides, entity_type: human, primary_name: "Hegemonides", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Left by Antiochus V as governor from Ptolemais to the Gerrenians.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 13:24", witness_id: web-2-maccabees}]}
  - {id: heliodorus, entity_type: human, primary_name: "Heliodorus", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Chancellor of Seleucus IV, struck down when trying to seize the temple treasury.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 3:7", witness_id: web-2-maccabees}]}
  - {id: hieronymus, entity_type: human, primary_name: "Hieronymus", classification: named_person, identity_status: named, aliases: [], gender: male, description: "District governor hostile to the Jews.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 12:2", witness_id: web-2-maccabees}]}
  - {id: hyrcanus-son-of-tobias, entity_type: human, primary_name: "Hyrcanus", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Wealthy man whose money was deposited in the temple treasury.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 3:11", witness_id: web-2-maccabees}]}
  - {id: jason-high-priest, entity_type: human, primary_name: "Jason", classification: named_person, identity_status: named, aliases: ["the vile Jason"], gender: male, description: "Brother of Onias who bought the high priesthood from Antiochus IV, hellenized Jerusalem, was outbid by Menelaus and died in exile.", identity_note: "1:7 'Jason and his company revolted from the holy land' is traditionally taken as this Jason; included here. Brother of Onias (4:7, 4:26) but no parent is named in 2MA. Same new_id used in 4MA. Same as 2MA's Jason; same new_id.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 1:7", witness_id: web-2-maccabees}]}
  - {id: jason-of-cyrene, entity_type: human, primary_name: "Jason of Cyrene", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Author of a five-volume history that 2 Maccabees abridges.", identity_note: "Distinct from Jason the high priest.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 2:23", witness_id: web-2-maccabees}]}
  - {id: john-envoy-2ma11, entity_type: human, primary_name: "John", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Jewish envoy to Lysias.", identity_note: "Some identify him with John (Gaddi) brother of Judas; not stated.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 11:17", witness_id: web-2-maccabees}]}
  - {id: jonathan-priest-2ma1, entity_type: human, primary_name: "Jonathan", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Priest who led the prayer at Nehemiah's sacrifice of the rekindled fire.", identity_note: "Distinct from Jonathan brother of Judas (8:22).", citations: [{source_id: world-english-bible, locator: "2 Maccabees 1:23", witness_id: web-2-maccabees}]}
  - {id: joseph-brother-of-judas-2ma, entity_type: human, primary_name: "Joseph", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Brother of Judas named as a division commander.", identity_note: "2MA names Simon, Joseph and Jonathan as Judas' brothers; 1 Macc 2:2-5 lists John (Gaddi) instead of Joseph. Possibly a scribal substitution for John, but kept as a separate entry. Distinct from the patriarch Joseph.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 8:22", witness_id: web-2-maccabees}]}
  - {id: lysimachus-brother-of-menelaus, entity_type: human, primary_name: "Lysimachus", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Brother and deputy of Menelaus, killed by a mob after temple sacrileges.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 4:29", witness_id: web-2-maccabees}]}
  - {id: mattathias-envoy-2ma14, entity_type: human, primary_name: "Mattathias", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Envoy sent by Nicanor to make pledges of friendship.", identity_note: "Not Mattathias the father of Judas.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 14:19", witness_id: web-2-maccabees}]}
  - {id: menelaus-high-priest, entity_type: human, primary_name: "Menelaus", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Brother of Simon who outbid Jason for the high priesthood, stole temple vessels and was executed at Beroea.", identity_note: "Brother of Simon the temple guardian (4:23) and of Lysimachus (4:29).", citations: [{source_id: world-english-bible, locator: "2 Maccabees 4:23", witness_id: web-2-maccabees}]}
  - {id: menestheus, entity_type: human, primary_name: "Menestheus", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Father of Apollonius.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 4:4", witness_id: web-2-maccabees}]}
  - {id: mother-of-seven-brothers, entity_type: human, primary_name: "Mother of the seven brothers", classification: unnamed_person, identity_status: unnamed_unique, aliases: [], gender: female, description: "Mother who encouraged her seven sons to die rather than break the law, and died last.", identity_note: "Same individual across 2MA (ch. 7) and 4MA (chs. 8-18); same new_id used in both files. The brothers are unnamed but each is individually distinguishable by his order of martyrdom. Same individual across 2MA (ch. 7) and 4MA (chs. 8-18); same new_id used in both files. The brothers are unnamed but each is individually distinguishable by his order of martyrdom. 17:1 reports she threw herself on the pile; 2MA 7:41 simply says she died.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 7:1", witness_id: web-2-maccabees}]}
  - {id: nicanor-governor-of-cyprus, entity_type: human, primary_name: "Nicanor", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Governor (commander) of the Cyprians hostile to the Jews.", identity_note: "Distinct from the other Nicanors in 2MA.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 12:2", witness_id: web-2-maccabees}]}
  - {id: nicanor-son-of-patroclus, entity_type: human, primary_name: "Nicanor son of Patroclus", classification: named_person, identity_status: named, aliases: [], gender: male, description: "One of the king's chief friends, sent to destroy Judea and sell its people; defeated and fled to Antioch.", identity_note: "Possibly the same as Nicanor the governor of Judea (14:12ff.); both are called 'thrice-accursed' (8:34, 15:3), and commentators often equate them, but 14:12 introduces him afresh as master of the elephants, so kept separate. Distinct from Nicanor governor of Cyprus (12:2).", citations: [{source_id: world-english-bible, locator: "2 Maccabees 8:9", witness_id: web-2-maccabees}]}
  - {id: old-man-of-athens, entity_type: human, primary_name: "An old man of Athens", classification: unnamed_person, identity_status: unnamed_unique, aliases: [], gender: male, description: "Athenian sent by the king to compel the Jews to abandon their laws.", identity_note: "Some read 'Geron the Athenian' as a proper name; WEB treats it as 'an old man'.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 6:1", witness_id: web-2-maccabees}]}
  - {id: onias-iii, entity_type: human, primary_name: "Onias", classification: named_person, identity_status: named, aliases: ["the high priest"], gender: male, description: "Pious high priest during Heliodorus' visit, supplanted by his brother Jason and murdered by Andronicus at Daphne.", identity_note: "Conventionally Onias III. Brother of Jason (4:7). Father not named in 2MA. Appears posthumously in Judas' dream (15:12-14). Same new_id used in 4MA. Same as Onias of 2MA 3-4; same new_id.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 3:1", witness_id: web-2-maccabees}]}
  - {id: patroclus, entity_type: human, primary_name: "Patroclus", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Father of Nicanor.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 8:9", witness_id: web-2-maccabees}]}
  - {id: philip-foster-brother-of-antiochus-iv, entity_type: human, primary_name: "Philip", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Foster brother of Antiochus IV who took his body home, fled to Egypt, and later became chancellor at Antioch.", identity_note: "9:29 and 13:23 merged as the same Philip (cf. 1 Macc 6:14-15, 55-56). Distinct from Philip the Phrygian.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 9:29", witness_id: web-2-maccabees}]}
  - {id: philip-the-phrygian, entity_type: human, primary_name: "Philip the Phrygian", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Phrygian governor left in Jerusalem by Antiochus IV, who burned Sabbath-keepers in caves.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 5:22", witness_id: web-2-maccabees}]}
  - {id: phylarch-of-timotheus, entity_type: human, primary_name: "The phylarch of Timotheus' forces", classification: unnamed_person, identity_status: unnamed_unique, aliases: [], gender: male, description: "Unholy commander of Timotheus' forces killed by the Jews.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 8:32", witness_id: web-2-maccabees}]}
  - {id: posidonius, entity_type: human, primary_name: "Posidonius", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Envoy sent by Nicanor to make pledges of friendship.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 14:19", witness_id: web-2-maccabees}]}
  - {id: ptolemy-macron, entity_type: human, primary_name: "Ptolemy Macron", classification: named_person, identity_status: named, aliases: ["Macron"], gender: male, description: "Former Ptolemaic governor of Cyprus who dealt justly with the Jews and took poison when accused.", identity_note: "Kept separate from Ptolemy son of Dorymenes.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 10:12", witness_id: web-2-maccabees}]}
  - {id: quintus-memmius, entity_type: human, primary_name: "Quintus Memmius", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Roman ambassador who wrote to the Jews.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 11:34", witness_id: web-2-maccabees}]}
  - {id: razis, entity_type: human, primary_name: "Razis", classification: named_person, identity_status: named, aliases: ["Father of the Jews"], gender: male, description: "Respected elder of Jerusalem who killed himself rather than be seized by Nicanor's soldiers.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 14:37", witness_id: web-2-maccabees}]}
  - {id: rhodocus, entity_type: human, primary_name: "Rhodocus", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Jewish soldier who betrayed secrets to the enemy and was imprisoned.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 13:21", witness_id: web-2-maccabees}]}
  - {id: seven-brothers-son-1, entity_type: human, primary_name: "First of the seven brothers", classification: unnamed_person, identity_status: unnamed_unique, aliases: [], gender: male, description: "Spokesman of the brothers; tongue cut out and fried in a pan.", identity_note: "Same individual across 2MA (ch. 7) and 4MA (chs. 8-18); same new_id used in both files. The brothers are unnamed but each is individually distinguishable by his order of martyrdom.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 7:1", witness_id: web-2-maccabees}]}
  - {id: seven-brothers-son-2, entity_type: human, primary_name: "Second of the seven brothers", classification: unnamed_person, identity_status: unnamed_unique, aliases: [], gender: male, description: "Scalped; affirmed the resurrection before dying.", identity_note: "Same individual across 2MA (ch. 7) and 4MA (chs. 8-18); same new_id used in both files. The brothers are unnamed but each is individually distinguishable by his order of martyrdom.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 7:1", witness_id: web-2-maccabees}]}
  - {id: seven-brothers-son-3, entity_type: human, primary_name: "Third of the seven brothers", classification: unnamed_person, identity_status: unnamed_unique, aliases: [], gender: male, description: "Offered his tongue and hands, hoping to receive them back from heaven.", identity_note: "Same individual across 2MA (ch. 7) and 4MA (chs. 8-18); same new_id used in both files. The brothers are unnamed but each is individually distinguishable by his order of martyrdom.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 7:1", witness_id: web-2-maccabees}]}
  - {id: seven-brothers-son-4, entity_type: human, primary_name: "Fourth of the seven brothers", classification: unnamed_person, identity_status: unnamed_unique, aliases: [], gender: male, description: "Tortured in the same way; denied a resurrection to life for the king.", identity_note: "Same individual across 2MA (ch. 7) and 4MA (chs. 8-18); same new_id used in both files. The brothers are unnamed but each is individually distinguishable by his order of martyrdom.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 7:1", witness_id: web-2-maccabees}]}
  - {id: seven-brothers-son-5, entity_type: human, primary_name: "Fifth of the seven brothers", classification: unnamed_person, identity_status: unnamed_unique, aliases: [], gender: male, description: "Warned the king that God would torture him and his descendants.", identity_note: "Same individual across 2MA (ch. 7) and 4MA (chs. 8-18); same new_id used in both files. The brothers are unnamed but each is individually distinguishable by his order of martyrdom.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 7:1", witness_id: web-2-maccabees}]}
  - {id: seven-brothers-son-6, entity_type: human, primary_name: "Sixth of the seven brothers", classification: unnamed_person, identity_status: unnamed_unique, aliases: [], gender: male, description: "Confessed that the Jews suffered for their own sins.", identity_note: "Same individual across 2MA (ch. 7) and 4MA (chs. 8-18); same new_id used in both files. The brothers are unnamed but each is individually distinguishable by his order of martyrdom.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 7:1", witness_id: web-2-maccabees}]}
  - {id: seven-brothers-son-7, entity_type: human, primary_name: "Seventh (youngest) of the seven brothers", classification: unnamed_person, identity_status: unnamed_unique, aliases: [], gender: male, description: "Youngest son, who refused the king's offers and was treated worst of all.", identity_note: "Same individual across 2MA (ch. 7) and 4MA (chs. 8-18); same new_id used in both files. The brothers are unnamed but each is individually distinguishable by his order of martyrdom.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 7:1", witness_id: web-2-maccabees}]}
  - {id: simon-temple-guardian, entity_type: human, primary_name: "Simon", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Benjamite guardian of the temple who informed against the treasury and slandered Onias; brother of Menelaus.", identity_note: "'Of the tribe of Benjamin' (3:4); some Latin/Armenian witnesses read 'Bilgah' (a priestly course). Brother of Menelaus (4:23). Same new_id used in 4MA 4:1-5. Distinct from Simon brother of Judas. Same person as Simon the temple guardian of 2MA 3-4; same new_id.", citations: [{source_id: world-english-bible, locator: "2 Maccabees 3:4", witness_id: web-2-maccabees}]}
