records:
  - {id: cleopatra-queen-esg-colophon, entity_type: human, primary_name: "Cleopatra", classification: named_person, identity_status: named, aliases: [], gender: female, description: "Ptolemaic queen co-reigning with Ptolemy in the colophon's date.", citations: [{source_id: world-english-bible, locator: "Additions to Esther 10:14", witness_id: web-additions-to-esther}]}
  - {id: dositheus-priest-esg, entity_type: human, primary_name: "Dositheus", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Self-described priest and Levite who brought the Purim letter to Egypt.", citations: [{source_id: world-english-bible, locator: "Additions to Esther 10:14", witness_id: web-additions-to-esther}]}
  - {id: gabatha-chamberlain-esg, entity_type: human, primary_name: "Gabatha", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Royal chamberlain and eunuch who plotted against the king and was exposed by Mordecai.", identity_note: "Addition A's plot parallels Hebrew Esther 2:21-23 (Bigthan and Teresh); Gabatha is probably the Greek form of Bigthan(a), but the Greek book presents Addition A as an earlier, separate episode (and repeats the plot at 2:21-23 with unnamed chamberlains), so not mapped to 'bigthan'. Reviewer may merge.", citations: [{source_id: world-english-bible, locator: "Additions to Esther 1:1", witness_id: web-additions-to-esther}]}
  - {id: lysimachus-translator-esg, entity_type: human, primary_name: "Lysimachus", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Man in Jerusalem said to have translated the Purim letter.", citations: [{source_id: world-english-bible, locator: "Additions to Esther 10:14", witness_id: web-additions-to-esther}]}
  - {id: ptolemy-father-of-lysimachus, entity_type: human, primary_name: "Ptolemeus", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Father of Lysimachus the translator.", identity_note: "Not the king; the text gives no sign he is the son of Dositheus, so kept separate.", citations: [{source_id: world-english-bible, locator: "Additions to Esther 10:14", witness_id: web-additions-to-esther}]}
  - {id: ptolemy-king-esg-colophon, entity_type: human, primary_name: "Ptolemeus", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Ptolemaic king in whose fourth year the Greek Esther was brought to Egypt.", identity_note: "Which Ptolemy (VIII, XII or XIV) is debated. 'Ptolemeus and Cleopatra' reign jointly; no spouse link recorded because the text does not state their relation.", citations: [{source_id: world-english-bible, locator: "Additions to Esther 10:14", witness_id: web-additions-to-esther}]}
  - {id: ptolemy-son-of-dositheus, entity_type: human, primary_name: "Ptolemeus", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Son of Dositheus who accompanied him with the Purim letter.", citations: [{source_id: world-english-bible, locator: "Additions to Esther 10:14", witness_id: web-additions-to-esther}]}
  - {id: tharrha-chamberlain-esg, entity_type: human, primary_name: "Tharrha", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Royal chamberlain and eunuch who plotted against the king with Gabatha.", identity_note: "Probably = Teresh of Hebrew Esther 2:21 (existing id 'teresh'); not mapped for the same reason as Gabatha. A Tharrha also appears among the seven chamberlains in Greek 1:10 (not addition text).", citations: [{source_id: world-english-bible, locator: "Additions to Esther 1:1", witness_id: web-additions-to-esther}]}
