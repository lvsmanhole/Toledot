record_type: entities
records:
  - {id: hasadiah-ancestor-of-baruch, entity_type: human, primary_name: "Asadias", classification: named_person, identity_status: named, aliases: ["Hasadiah"], gender: male, description: "Ancestor of Baruch, son of Helkias.", identity_note: "Not the existing 'hasadiah' (a post-exilic descendant of Jehoiachin, 1 Chr 3:20).", citations: [{source_id: world-english-bible, locator: "Baruch 1:1", witness_id: web-baruch}]}
  - {id: hilkiah-ancestor-of-baruch, entity_type: human, primary_name: "Helkias", classification: named_person, identity_status: named, aliases: ["Hilkiah"], gender: male, description: "Earliest named ancestor of Baruch.", identity_note: "Not identifiable with any Hebrew-Bible Hilkiah; distinct from Helkias father of the high priest Joakim (1:7).", citations: [{source_id: world-english-bible, locator: "Baruch 1:1", witness_id: web-baruch}]}
  - {id: hilkiah-father-of-joakim-bar, entity_type: human, primary_name: "Helkias", classification: named_person, identity_status: named, aliases: ["Hilkiah"], gender: male, description: "Father of the high priest Joakim, son of Salom.", identity_note: "'Hilkiah son of Shallum' matches the high priest Hilkiah son of Shallum (existing 'hilkiah-2ki22', 1 Chr 6:13), but that genealogy gives him no son Joakim; possible identity flagged, not mapped.", citations: [{source_id: world-english-bible, locator: "Baruch 1:7", witness_id: web-baruch}]}
  - {id: joakim-high-priest-bar, entity_type: human, primary_name: "Joakim", classification: named_person, identity_status: named, aliases: ["Jehoiakim"], gender: male, description: "High priest in Jerusalem to whom the exiles sent money.", identity_note: "Absent from the Hebrew Bible's high-priest lists (Seraiah was high priest at the fall, 2 Ki 25:18); unrelated to Joiakim son of Jeshua (Neh 12:10).", citations: [{source_id: world-english-bible, locator: "Baruch 1:7", witness_id: web-baruch}]}
  - {id: shallum-grandfather-of-joakim-bar, entity_type: human, primary_name: "Salom", classification: named_person, identity_status: named, aliases: ["Shallum"], gender: male, description: "Grandfather of the high priest Joakim.", identity_note: "Possibly = Shallum the high priest (existing 'shallum-1ch6'); not mapped, see the Helkias (1:7) note.", citations: [{source_id: world-english-bible, locator: "Baruch 1:7", witness_id: web-baruch}]}
  - {id: zedekiah-son-of-hasadiah-bar, entity_type: human, primary_name: "Sedekias", classification: named_person, identity_status: named, aliases: ["Zedekiah"], gender: male, description: "Great-grandfather of Baruch, son of Asadias.", identity_note: "Distinct from King Sedekias son of Josias (1:8).", citations: [{source_id: world-english-bible, locator: "Baruch 1:1", witness_id: web-baruch}]}
