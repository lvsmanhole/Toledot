schema_version: 1
record_type: entities
records:
  - {id: arsinoe-iii, entity_type: human, primary_name: "Arsinoe", classification: named_person, identity_status: named, aliases: [], gender: female, description: "Sister of Ptolemy IV who rallied the troops at Raphia with promises of gold.", identity_note: "3MA calls her his sister (1:1); historically Arsinoe III was also his wife, but the text does not say so, so no spouse is recorded.", citations: [{source_id: world-english-bible, locator: "3 Maccabees 1:1", witness_id: web-3-maccabees}]}
  - {id: dositheus-son-of-drimulus, entity_type: human, primary_name: "Dositheus", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Apostate Jew who saved Ptolemy by placing a substitute in his tent.", identity_note: "'Called the son of Drimulus'. Distinct from the Dositheuses of 2MA 12.", citations: [{source_id: world-english-bible, locator: "3 Maccabees 1:3", witness_id: web-3-maccabees}]}
  - {id: drimulus, entity_type: human, primary_name: "Drimulus", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Father of Dositheus.", citations: [{source_id: world-english-bible, locator: "3 Maccabees 1:3", witness_id: web-3-maccabees}]}
  - {id: eleazar-priest-3ma, entity_type: human, primary_name: "Eleazar", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Aged, illustrious priest of the country whose prayer preceded the deliverance at the hippodrome.", identity_note: "Different person from Eleazar the martyr of 2MA 6/4MA (different setting: Egypt under Ptolemy IV).", citations: [{source_id: world-english-bible, locator: "3 Maccabees 6:1", witness_id: web-3-maccabees}]}
  - {id: hermon-elephant-master, entity_type: human, primary_name: "Hermon", classification: named_person, identity_status: named, aliases: ["the master of the elephants"], gender: male, description: "Keeper of the king's elephants ordered to drug them for the execution of the Jews.", identity_note: "Personal name here, not Mount Hermon.", citations: [{source_id: world-english-bible, locator: "3 Maccabees 5:1", witness_id: web-3-maccabees}]}
  - {id: phalaris, entity_type: human, primary_name: "Phalaris", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Notoriously cruel tyrant (of Acragas) to whom the king is compared.", identity_note: "Historical non-biblical figure mentioned only by comparison.", citations: [{source_id: world-english-bible, locator: "3 Maccabees 5:20", witness_id: web-3-maccabees}]}
  - {id: ptolemy-iv-philopator, entity_type: human, primary_name: "Philopater", classification: named_person, identity_status: named, aliases: ["Ptolemy", "Ptolemy Philopater", "Ptolemy Philopator", "Philopator", "the king"], gender: male, description: "Ptolemaic king who defeated Antiochus at Raphia, tried to enter the temple, and persecuted then released the Jews of Egypt.", identity_note: "Ptolemy IV Philopator. Arsinoe is called his sister (1:1); no parents or spouse are stated in 3MA.", citations: [{source_id: world-english-bible, locator: "3 Maccabees 1:1", witness_id: web-3-maccabees}]}
  - {id: ptolemy-iv-tent-substitute, entity_type: human, primary_name: "The obscure man in Ptolemy's tent", classification: unnamed_person, identity_status: unnamed_unique, aliases: [], gender: male, description: "Obscure person placed in Ptolemy's bed who was killed in his stead.", citations: [{source_id: world-english-bible, locator: "3 Maccabees 1:3", witness_id: web-3-maccabees}]}
  - {id: simon-son-of-onias-high-priest, entity_type: human, primary_name: "Simon", classification: named_person, identity_status: named, aliases: [], gender: male, description: "High priest who prayed against Ptolemy's intrusion into the sanctuary.", identity_note: "Historically Simon II (c. 219-196 BCE), probably the Simon son of Onias praised in Sirach 50:1; reviewer should reconcile with the SIR census id. Distinct from the Simons of 2MA. Usually identified as Simon II (high priest c. 219-196 BC); not an existing entity. Sirach 50 (Simon son of Onias) and 3 Maccabees 2:1 (the high priest Simon under Ptolemy IV) are identified here as Simon II; the identification is editorial.", citations: [{source_id: world-english-bible, locator: "3 Maccabees 2:1", witness_id: web-3-maccabees}]}
  - {id: theodotus-3ma, entity_type: human, primary_name: "Theodotus", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Officer who tried to assassinate Ptolemy in his tent before Raphia.", identity_note: "Distinct from Theodotus of 2MA 14:19.", citations: [{source_id: world-english-bible, locator: "3 Maccabees 1:2", witness_id: web-3-maccabees}]}
