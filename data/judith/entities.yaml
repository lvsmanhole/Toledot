schema_version: 1
record_type: entities
records:
  - {id: achior, entity_type: human, primary_name: "Achior", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Leader of the Ammonites who warned Holofernes about Israel's God and later was circumcised and joined Israel.", identity_note: "Called \"the Ammonite\" (14:5) and \"hireling of Ammon\" (6:5).", citations: [{source_id: world-english-bible, locator: "Judith 5:5", witness_id: web-judith}]}
  - {id: ahitub-jdt, entity_type: human, primary_name: "Ahitub", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Ancestor of Judith in her genealogy (8:1), son of Elihu.", identity_note: "Not any of the priestly Ahitubs.", citations: [{source_id: world-english-bible, locator: "Judith 8:1", witness_id: web-judith}]}
  - {id: ananias-jdt, entity_type: human, primary_name: "Ananias", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Ancestor of Judith in her genealogy (8:1), son of Gideon.", identity_note: "Different from Ananias of Tobit.", citations: [{source_id: world-english-bible, locator: "Judith 8:1", witness_id: web-judith}]}
  - {id: arioch-king-of-elymaeans, entity_type: human, primary_name: "Arioch", classification: named_person, identity_status: named, aliases: [], gender: male, description: "King of the Elymaeans, an ally in the war against Arphaxad.", identity_note: "Not Arioch of Gen 14 or Arioch of Daniel 2. The WEB says \"the plain of Arioch the king of the Elymaeans\" (1:6).", citations: [{source_id: world-english-bible, locator: "Judith 1:6", witness_id: web-judith}]}
  - {id: arphaxad-king-of-medes, entity_type: human, primary_name: "Arphaxad", classification: named_person, identity_status: named, aliases: [], gender: male, description: "King of the Medes in Ecbatana, defeated and killed by Nebuchadnezzar.", identity_note: "Unrelated to Arpachshad son of Shem; no historical Median king of this name is known (sometimes linked to Deioces or Phraortes).", citations: [{source_id: world-english-bible, locator: "Judith 1:1", witness_id: web-judith}]}
  - {id: bagoas-jdt, entity_type: human, primary_name: "Bagoas", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Eunuch in charge of Holofernes' household who found him dead.", citations: [{source_id: world-english-bible, locator: "Judith 12:11", witness_id: web-judith}]}
  - {id: chabris, entity_type: human, primary_name: "Chabris", classification: named_person, identity_status: named, aliases: [], gender: male, description: "One of the rulers (elders) of Bethulia.", citations: [{source_id: world-english-bible, locator: "Judith 6:15", witness_id: web-judith}]}
  - {id: charmis, entity_type: human, primary_name: "Charmis", classification: named_person, identity_status: named, aliases: [], gender: male, description: "One of the rulers (elders) of Bethulia.", citations: [{source_id: world-english-bible, locator: "Judith 6:15", witness_id: web-judith}]}
  - {id: eliab-jdt, entity_type: human, primary_name: "Eliab", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Ancestor of Judith in her genealogy (8:1), son of Nathanael.", identity_note: "Not identified with Eliab son of Helon (Zebulun).", citations: [{source_id: world-english-bible, locator: "Judith 8:1", witness_id: web-judith}]}
  - {id: elihu-jdt, entity_type: human, primary_name: "Elihu", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Ancestor of Judith in her genealogy (8:1), son of Eliab.", citations: [{source_id: world-english-bible, locator: "Judith 8:1", witness_id: web-judith}]}
  - {id: elkiah-jdt, entity_type: human, primary_name: "Elkiah", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Ancestor of Judith in her genealogy (8:1), son of Ananias.", citations: [{source_id: world-english-bible, locator: "Judith 8:1", witness_id: web-judith}]}
  - {id: gideon-jdt, entity_type: human, primary_name: "Gideon", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Ancestor of Judith in her genealogy (8:1), son of Raphaim.", identity_note: "Not Gideon the judge (a Manassite).", citations: [{source_id: world-english-bible, locator: "Judith 8:1", witness_id: web-judith}]}
  - {id: gothoniel, entity_type: human, primary_name: "Gothoniel", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Father of Chabris, ruler of Bethulia.", identity_note: "Gothoniel is the Greek form of Othniel, but this is not Othniel the judge.", citations: [{source_id: world-english-bible, locator: "Judith 6:15", witness_id: web-judith}]}
  - {id: holofernes, entity_type: human, primary_name: "Holofernes", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Chief captain of Nebuchadnezzar's army, beheaded by Judith.", citations: [{source_id: world-english-bible, locator: "Judith 2:4", witness_id: web-judith}]}
  - {id: joakim-high-priest-jdt, entity_type: human, primary_name: "Joakim", classification: named_person, identity_status: named, aliases: [], gender: male, description: "High priest in Jerusalem who organised the defence and later honored Judith.", identity_note: "Possibly intended as Joiakim son of Jeshua (Neh 12:10, 26), since the story is set just after the return (4:3), but the book is not historically anchored and the name was common among priests (cf. Baruch 1:7 Joakim son of Hilkiah); not mapped to existing joiakim.", citations: [{source_id: world-english-bible, locator: "Judith 4:6", witness_id: web-judith}]}
  - {id: joseph-jdt, entity_type: human, primary_name: "Joseph", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Ancestor of Judith in her genealogy (8:1), son of Oziel.", identity_note: "Not Joseph son of Jacob.", citations: [{source_id: world-english-bible, locator: "Judith 8:1", witness_id: web-judith}]}
  - {id: judith-maid, entity_type: human, primary_name: "Judith's maid", classification: unnamed_person, identity_status: unnamed_unique, aliases: [], gender: female, description: "Maid in charge of Judith's household who accompanied her to Holofernes' camp; freed before Judith died.", citations: [{source_id: world-english-bible, locator: "Judith 8:10", witness_id: web-judith}]}
  - {id: judith-person, entity_type: human, primary_name: "Judith", classification: named_person, identity_status: named, aliases: [], gender: female, description: "Simeonite widow of Bethulia who beheaded Holofernes and delivered Israel.", identity_note: "Widowed three years and four months at the start of the story (8:4). Calls Simeon \"my father\" (9:2), i.e. Simeonite ancestry.", citations: [{source_id: world-english-bible, locator: "Judith 8:1", witness_id: web-judith}]}
  - {id: manasses-husband-of-judith, entity_type: human, primary_name: "Manasses", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Judith's husband, of her tribe and family, who died of sunstroke at the barley harvest.", citations: [{source_id: world-english-bible, locator: "Judith 8:2", witness_id: web-judith}]}
  - {id: melchiel-jdt, entity_type: human, primary_name: "Melchiel", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Father of Charmis, ruler of Bethulia.", citations: [{source_id: world-english-bible, locator: "Judith 6:15", witness_id: web-judith}]}
  - {id: merari-jdt, entity_type: human, primary_name: "Merari", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Judith's father, son of Ox.", identity_note: "Not Merari son of Levi.", citations: [{source_id: world-english-bible, locator: "Judith 8:1", witness_id: web-judith}]}
  - {id: micah-father-of-ozias, entity_type: human, primary_name: "Micah", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Simeonite father of Ozias, ruler of Bethulia.", identity_note: "Not the prophet Micah or any other Hebrew-Bible Micah.", citations: [{source_id: world-english-bible, locator: "Judith 6:15", witness_id: web-judith}]}
  - {id: nathanael-jdt, entity_type: human, primary_name: "Nathanael", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Ancestor of Judith in her genealogy (8:1), son of Salamiel.", identity_note: "Not identified with Nethanel son of Zuar (Issachar).", citations: [{source_id: world-english-bible, locator: "Judith 8:1", witness_id: web-judith}]}
  - {id: nebuchadnezzar-judith, entity_type: human, primary_name: "Nebuchadnezzar", classification: named_person, identity_status: named, aliases: [], gender: male, description: "\"King of the Assyrians\" reigning in Nineveh who defeats Arphaxad and sends Holofernes west.", identity_note: "Literary figure: Judith makes Nebuchadnezzar king of Assyria at Nineveh, after the return from exile (4:3, 5:19), and demands worship as a god (3:8, 6:2). This combination fits no historical reign (the Babylonian Nebuchadnezzar II never ruled from Nineveh, which had fallen in 612 BC, and he predates the return). Kept as a separate person rather than mapped to the existing nebuchadnezzar id so that the book's fictional dates (years 12-18) are not attached to Nebuchadnezzar II.", citations: [{source_id: world-english-bible, locator: "Judith 1:1", witness_id: web-judith}]}
  - {id: ox-jdt, entity_type: human, primary_name: "Ox", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Ancestor of Judith in her genealogy (8:1), son of Joseph.", citations: [{source_id: world-english-bible, locator: "Judith 8:1", witness_id: web-judith}]}
  - {id: ozias-of-bethulia, entity_type: human, primary_name: "Ozias", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Chief ruler (governor) of Bethulia, of the tribe of Simeon.", identity_note: "Ozias = Uzziah; not King Uzziah of Judah.", citations: [{source_id: world-english-bible, locator: "Judith 6:15", witness_id: web-judith}]}
  - {id: oziel-jdt, entity_type: human, primary_name: "Oziel", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Ancestor of Judith in her genealogy (8:1), son of Elkiah.", citations: [{source_id: world-english-bible, locator: "Judith 8:1", witness_id: web-judith}]}
  - {id: raphaim-jdt, entity_type: human, primary_name: "Raphaim", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Ancestor of Judith in her genealogy (8:1), son of Ahitub.", citations: [{source_id: world-english-bible, locator: "Judith 8:1", witness_id: web-judith}]}
