schema_version: 1
record_type: entities
records:
  - {id: absalom-1ma, entity_type: human, primary_name: "Absalom", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Father of Mattathias and of Jonathan, officers under the Hasmoneans.", identity_note: "11:70 and 13:11 both say 'son of Absalom'; treated as the same father (so the two officers would be brothers), but the text does not confirm this. Not King David's son.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 11:70", witness_id: web-1-maccabees}]}
  - {id: abubus, entity_type: human, primary_name: "Abubus", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Father of Ptolemy the governor of the plain of Jericho.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 16:11", witness_id: web-1-maccabees}]}
  - {id: accos, entity_type: human, primary_name: "Accos", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Grandfather of the envoy Eupolemus.", identity_note: "Possibly of the priestly house of Hakkoz (Ezra 2:61), but not mapped.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 8:17", witness_id: web-1-maccabees}]}
  - {id: alcimus, entity_type: human, primary_name: "Alcimus", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Leader of the Hellenizing party made high priest by Demetrius I; a priest of Aaron's line who killed sixty Hasidaeans and died of a paralytic stroke while demolishing the inner court wall.", identity_note: "7:14 calls him 'a priest of the seed of Aaron'.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 7:5", witness_id: web-1-maccabees}]}
  - {id: alexander-balas, entity_type: human, primary_name: "Alexander Epiphanes", classification: named_person, identity_status: named, aliases: ["Alexander", "King Alexander"], gender: male, description: "Claimant styled son of Antiochus who seized Ptolemais in year 160, defeated Demetrius I, married Cleopatra daughter of Ptolemy, made Jonathan high priest, and was beheaded in Arabia by Zabdiel.", identity_note: "Historically Alexander Balas; the text calls him 'son of Antiochus' (10:1), a claim historians doubt. Distinct from Alexander the Great.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 10:1", witness_id: web-1-maccabees}]}
  - {id: alexander-the-great, entity_type: human, primary_name: "Alexander", classification: named_person, identity_status: named, aliases: ["Alexander the Macedonian"], gender: male, description: "Alexander the Macedonian, son of Philip, who defeated Darius, ruled over Greece and the east, divided his kingdom among his servants, and died after reigning twelve years.", identity_note: "Distinct from Alexander Epiphanes (Balas) of chapters 10-11.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 1:1", witness_id: web-1-maccabees}]}
  - {id: antiochus-father-of-numenius, entity_type: human, primary_name: "Antiochus", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Father of the envoy Numenius.", identity_note: "A Jew, not one of the Seleucid kings.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 12:16", witness_id: web-1-maccabees}]}
  - {id: antiochus-iii-the-great, entity_type: human, primary_name: "Antiochus", classification: named_person, identity_status: named, aliases: ["Antiochus the great king of Asia"], gender: male, description: "Seleucid king, father of Antiochus Epiphanes; 'the great king of Asia' who was defeated and captured by the Romans and made tributary.", identity_note: "1:10 'Antiochus the king' (father of Epiphanes) and 8:6 'Antiochus the great king of Asia' are both Antiochus III the Great; merged on historical grounds. Historically Antiochus III; distinct from Antiochus IV of 2/4MA.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 1:10", witness_id: web-1-maccabees}]}
  - {id: antiochus-iv-epiphanes, entity_type: human, primary_name: "Antiochus Epiphanes", classification: named_person, identity_status: named, aliases: ["Antiochus", "King Antiochus", "Epiphanes", "the tyrant"], gender: male, description: "Seleucid king, son of Antiochus, formerly a hostage at Rome; invaded Egypt, plundered the temple and enforced the apostasy; died in Persia in year 149.", identity_note: "Also referred to as 'the king' throughout chapters 1-6 (only key verses listed). 6:23 'your father' (addressing Antiochus V) and 10:1 (father of Alexander Epiphanes) included. The prefatory letter (1:13-16) reports an Antiochus killed in the temple of Nanaea; it is traditionally read as Antiochus IV despite conflicting with ch. 9's account of his death (some scholars suggest Antiochus III or VII). Merged here with that caveat. His father (9:23 'my father', not named) is not recorded. In 4MA 4:15 he is called son of Seleucus. Same new_id used in 4MA. 4MA 4:15 calls him the son of Seleucus (IV); historically he was Seleucus IV's brother. Recorded as stated. Same new_id as 2MA.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 1:10", witness_id: web-1-maccabees}]}
  - {id: antiochus-v-eupator, entity_type: human, primary_name: "Antiochus", classification: named_person, identity_status: named, aliases: ["Eupator", "Antiochus Eupator"], gender: male, description: "Son of Antiochus Epiphanes, raised by Lysias and crowned as Eupator; besieged the sanctuary, then was killed with Lysias by the army when Demetrius took the throne.", identity_note: "Antiochus IV calls him 'my son Antiochus' (9:25); 'Eupator his son' (2:20). 'Antiochus' in 11:22, 11:27, 13:3, 13:4 and 14:2 refers to him.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 3:33", witness_id: web-1-maccabees}]}
  - {id: antiochus-vi-dionysus, entity_type: human, primary_name: "Antiochus", classification: named_person, identity_status: named, aliases: ["the young child Antiochus", "King Antiochus"], gender: male, description: "Young child of Alexander Epiphanes raised by Imalcue the Arabian, set on the throne by Trypho, and later treacherously killed by him.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 11:39", witness_id: web-1-maccabees}]}
  - {id: antiochus-vii-sidetes, entity_type: human, primary_name: "Antiochus", classification: named_person, identity_status: named, aliases: ["King Antiochus"], gender: male, description: "Son of Demetrius who wrote to Simon granting privileges, returned in year 174, besieged Trypho at Dor, then broke with Simon and sent Cendebaeus against Judea.", identity_note: "Historically Antiochus VII Sidetes, son of Demetrius I. 16:18 'the king' to whom Ptolemy son of Abubus wrote is presumably also he but is not listed.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 15:1", witness_id: web-1-maccabees}]}
  - {id: antipater-son-of-jason, entity_type: human, primary_name: "Antipater", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Envoy sent with Numenius to Rome and Sparta.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 12:16", witness_id: web-1-maccabees}]}
  - {id: apollonius-coelesyria, entity_type: human, primary_name: "Apollonius", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Governor of Coelesyria for Demetrius II who challenged Jonathan and was defeated near Azotus.", identity_note: "Distinct from the Apollonius killed by Judas in 3:11.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 10:69", witness_id: web-1-maccabees}]}
  - {id: apollonius-samaria-1ma3, entity_type: human, primary_name: "Apollonius", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Commander who led Gentile forces from Samaria against Israel and was killed by Judas, who took his sword.", identity_note: "Distinct from Apollonius governor of Coelesyria under Demetrius II (10:69-79), about 20 years later.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 3:10", witness_id: web-1-maccabees}]}
  - {id: apostate-jew-modin, entity_type: human, primary_name: "Jew who sacrificed at Modin", classification: unnamed_person, identity_status: unnamed_unique, aliases: [], gender: male, description: "Jew who came forward to sacrifice on the pagan altar at Modin and was killed by Mattathias.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 2:23", witness_id: web-1-maccabees}]}
  - {id: ariarathes-v, entity_type: human, primary_name: "Arathes", classification: named_person, identity_status: named, aliases: ["Ariarathes"], gender: male, description: "King (Ariarathes V of Cappadocia) to whom the Roman letter was also sent.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 15:22", witness_id: web-1-maccabees}]}
  - {id: arius-sparta, entity_type: human, primary_name: "Arius", classification: named_person, identity_status: named, aliases: ["Areus"], gender: male, description: "King of the Spartans who wrote to the high priest Onias claiming kinship with the Jews.", identity_note: "Historically Areus I of Sparta (309-265 BC).", citations: [{source_id: world-english-bible, locator: "1 Maccabees 12:7", witness_id: web-1-maccabees}]}
  - {id: arsaces-parthia, entity_type: human, primary_name: "Arsaces", classification: named_person, identity_status: named, aliases: [], gender: male, description: "King of Persia and Media who captured Demetrius II.", identity_note: "Dynastic name of the Parthian kings; historically Mithridates I.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 14:2", witness_id: web-1-maccabees}]}
  - {id: arsaces-prince-1ma14, entity_type: human, primary_name: "Prince of Arsaces", classification: unnamed_person, identity_status: unnamed_unique, aliases: [], gender: male, description: "One of Arsaces' princes, sent to capture Demetrius II alive.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 14:2", witness_id: web-1-maccabees}]}
  - {id: athenobius, entity_type: human, primary_name: "Athenobius", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Friend of Antiochus VII sent to Jerusalem to demand Joppa, Gazara and the citadel from Simon.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 15:28", witness_id: web-1-maccabees}]}
  - {id: attalus-ii, entity_type: human, primary_name: "Attalus", classification: named_person, identity_status: named, aliases: [], gender: male, description: "King (Attalus II of Pergamum) to whom the Roman letter was also sent.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 15:22", witness_id: web-1-maccabees}]}
  - {id: azarias-1ma, entity_type: human, primary_name: "Azarias", classification: named_person, identity_status: named, aliases: ["Azariah"], gender: male, description: "Commander left with Joseph son of Zacharias in Judea, defeated at Jamnia.", identity_note: "Distinct from Azariah companion of Daniel (2:59).", citations: [{source_id: world-english-bible, locator: "1 Maccabees 5:18", witness_id: web-1-maccabees}]}
  - {id: bacchides, entity_type: human, primary_name: "Bacchides", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Friend of Demetrius I and ruler beyond the river who installed Alcimus, defeated and killed Judas at Elasa, fortified Judea, and finally made peace with Jonathan.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 7:8", witness_id: web-1-maccabees}]}
  - {id: bride-nadabath-1ma9, entity_type: human, primary_name: "Bride from Nadabath", classification: unnamed_person, identity_status: unnamed_unique, aliases: [], gender: female, description: "Daughter of a great noble of Canaan brought from Nadabath to marry among the sons of Jambri; her wedding procession was ambushed by Jonathan and Simon.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 9:37", witness_id: web-1-maccabees}]}
  - {id: bridegroom-jambri-1ma9, entity_type: human, primary_name: "Bridegroom of the sons of Jambri", classification: unnamed_person, identity_status: unnamed_unique, aliases: [], gender: male, description: "Bridegroom who came out with his friends to meet the bridal procession and was attacked in the ambush avenging John.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 9:39", witness_id: web-1-maccabees}]}
  - {id: cendebaeus, entity_type: human, primary_name: "Cendebaeus", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Commander of the sea coast for Antiochus VII who fortified Kidron and raided Judea; routed by John and Judas son of Simon.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 15:38", witness_id: web-1-maccabees}]}
  - {id: chalphi, entity_type: human, primary_name: "Chalphi", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Father of Judas, one of Jonathan's captains.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 11:70", witness_id: web-1-maccabees}]}
  - {id: cleopatra-thea, entity_type: human, primary_name: "Cleopatra", classification: named_person, identity_status: named, aliases: [], gender: female, description: "Daughter of King Ptolemy, married to Alexander Epiphanes at Ptolemais and then given by her father to Demetrius II.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 10:57", witness_id: web-1-maccabees}]}
  - {id: darius-iii, entity_type: human, primary_name: "Darius", classification: named_person, identity_status: named, aliases: [], gender: male, description: "King of the Persians and Medes defeated by Alexander (Darius III).", identity_note: "Not the Darius of Ezra/Haggai or Daniel; new person.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 1:1", witness_id: web-1-maccabees}]}
  - {id: demetrius-i-soter, entity_type: human, primary_name: "Demetrius", classification: named_person, identity_status: named, aliases: ["King Demetrius"], gender: male, description: "Son of Seleucus who came from Rome and took the throne in year 151, sent Bacchides, Alcimus and Nicanor against Judea, and fell in battle against Alexander Epiphanes.", identity_note: "Distinct from his son Demetrius II (from 10:67 on). 15:1 names him as father of Antiochus VII.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 7:1", witness_id: web-1-maccabees}]}
  - {id: demetrius-ii-nicator, entity_type: human, primary_name: "Demetrius", classification: named_person, identity_status: named, aliases: ["King Demetrius", "Demetrius, son of Demetrius"], gender: male, description: "Son of Demetrius I who came from Crete in year 165, became king in year 167 after Ptolemy's intervention, alienated Jonathan, later recognised Simon, and was captured by Arsaces in Media.", identity_note: "Distinct from his father Demetrius I. 'Demetrius' princes' (11:63; 12:24) included. 1:7 is dated to Seleucid year 169 (c. 143 BCE), which falls in the reign of Demetrius II, not Demetrius I of ch. 14. Kept separate from demetrius-i-soter.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 10:67", witness_id: web-1-maccabees}]}
  - {id: dorymenes, entity_type: human, primary_name: "Dorymenes", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Father of Ptolemy, one of the generals chosen by Lysias.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 3:38", witness_id: web-1-maccabees}]}
  - {id: eleazar-avaran, entity_type: human, primary_name: "Eleazar", classification: named_person, identity_status: named, aliases: ["Avaran"], gender: male, description: "Son of Mattathias called Avaran; killed when the war elephant he stabbed at Beth-zechariah fell on him.", identity_note: "Distinct from Eleazar father of the envoy Jason (8:17).", citations: [{source_id: world-english-bible, locator: "1 Maccabees 2:5", witness_id: web-1-maccabees}]}
  - {id: eleazar-father-of-jason, entity_type: human, primary_name: "Eleazar", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Father of the envoy Jason.", identity_note: "Distinct from Eleazar Avaran.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 8:17", witness_id: web-1-maccabees}]}
  - {id: eumenes-ii, entity_type: human, primary_name: "Eumenes", classification: named_person, identity_status: named, aliases: [], gender: male, description: "King who received territories taken by Rome from Antiochus (Eumenes II of Pergamum).", citations: [{source_id: world-english-bible, locator: "1 Maccabees 8:8", witness_id: web-1-maccabees}]}
  - {id: eupolemus, entity_type: human, primary_name: "Eupolemus", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Envoy chosen by Judas and sent to Rome to establish friendship and alliance.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 8:17", witness_id: web-1-maccabees}]}
  - {id: gorgias, entity_type: human, primary_name: "Gorgias", classification: named_person, identity_status: named, aliases: [], gender: male, description: "One of the king's friends; led the night raid against Judas near Emmaus and later defeated Joseph and Azarias at Jamnia.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 3:38", witness_id: web-1-maccabees}]}
  - {id: imalcue, entity_type: human, primary_name: "Imalcue", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Arabian who was raising Alexander's young son Antiochus.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 11:39", witness_id: web-1-maccabees}]}
  - {id: jason-father-of-antipater, entity_type: human, primary_name: "Jason", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Father of the envoy Antipater.", identity_note: "Possibly identical with Jason son of Eleazar (8:17); not merged.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 12:16", witness_id: web-1-maccabees}]}
  - {id: jason-son-of-eleazar, entity_type: human, primary_name: "Jason", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Envoy sent by Judas to Rome with Eupolemus.", identity_note: "Possibly the father of the envoy Antipater (12:16), but the text does not say so; kept separate.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 8:17", witness_id: web-1-maccabees}]}
  - {id: john-father-of-eupolemus, entity_type: human, primary_name: "John", classification: named_person, identity_status: named, aliases: ["John the father of Eupolemus"], gender: male, description: "Son of Accos and father of the envoy Eupolemus.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 8:17", witness_id: web-1-maccabees}]}
  - {id: john-father-of-mattathias, entity_type: human, primary_name: "John", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Father of the priest Mattathias of Modin.", identity_note: "Distinct from Mattathias' son John Gaddis, Simon's son John (Hyrcanus) and John father of Eupolemus.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 2:1", witness_id: web-1-maccabees}]}
  - {id: john-gaddis, entity_type: human, primary_name: "John", classification: named_person, identity_status: named, aliases: ["Gaddis"], gender: male, description: "Eldest son of Mattathias, surnamed Gaddis; seized and (by implication) killed by the sons of Jambri from Medaba while escorting baggage to the Nabataeans.", identity_note: "9:35 'his brother' and 9:38/9:42 'John their brother' identify him with John Gaddis. His death is implied by 9:42 ('avenged the blood of their brother'), not narrated explicitly.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 2:2", witness_id: web-1-maccabees}]}
  - {id: john-hyrcanus, entity_type: human, primary_name: "John", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Son of Simon, made commander of the forces at Gazara; defeated Cendebaeus, escaped Ptolemy son of Abubus' plot, and succeeded his father as high priest.", identity_note: "Known historically as John Hyrcanus I; the surname does not occur in the WEB text of 1 Maccabees. Distinct from John Gaddis, his uncle.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 13:53", witness_id: web-1-maccabees}]}
  - {id: jonathan-apphus, entity_type: human, primary_name: "Jonathan", classification: named_person, identity_status: named, aliases: ["Apphus"], gender: male, description: "Youngest son of Mattathias called Apphus; succeeded Judas, was made high priest by Alexander Balas, was seized by Trypho at Ptolemais and killed at Bascama; buried at Modin.", identity_note: "Distinct from Jonathan son of Saul (4:30) and Jonathan son of Absalom (13:11). 13:16-19 mentions two of his sons sent as hostages (unnamed group, not entered). Reviewer: reconcile id with the 1MA census (Jonathan Apphus).", citations: [{source_id: world-english-bible, locator: "1 Maccabees 2:5", witness_id: web-1-maccabees}]}
  - {id: jonathan-son-of-absalom, entity_type: human, primary_name: "Jonathan", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Commander sent by Simon with an army to take Joppa.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 13:11", witness_id: web-1-maccabees}]}
  - {id: joseph-son-of-zacharias, entity_type: human, primary_name: "Joseph", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Son of Zacharias, left with Azarias to guard Judea; disobeyed orders, attacked Jamnia and was defeated by Gorgias.", identity_note: "Distinct from the patriarch Joseph (2:53).", citations: [{source_id: world-english-bible, locator: "1 Maccabees 5:18", witness_id: web-1-maccabees}]}
  - {id: judas-maccabeus, entity_type: human, primary_name: "Judas", classification: named_person, identity_status: named, aliases: ["Maccabaeus", "Judas Maccabaeus"], gender: male, description: "Third son of Mattathias, called Maccabaeus; military leader of the revolt who rededicated the temple, defeated Nicanor, sought a Roman alliance, and fell in battle against Bacchides at Elasa.", identity_note: "The 'Judas' of the letter in 1:10 (and 2:14) is usually taken as Judas Maccabeus, though the letter's date has led some to propose another Judas; merged here. His brothers Simon, Joseph and Jonathan are named in 8:22; his father is not named in 2MA. Reviewer: reconcile id with the 1MA census.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 2:4", witness_id: web-1-maccabees}]}
  - {id: judas-son-of-chalphi, entity_type: human, primary_name: "Judas", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Captain who stood firm with Jonathan at the battle of Hazor.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 11:70", witness_id: web-1-maccabees}]}
  - {id: judas-son-of-simon, entity_type: human, primary_name: "Judas", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Son of Simon who fought beside his brother John against Cendebaeus and was wounded; murdered with his father at Dok.", identity_note: "Distinct from his uncle Judas Maccabaeus and Judas son of Chalphi.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 16:2", witness_id: web-1-maccabees}]}
  - {id: kings-officer-modin, entity_type: human, primary_name: "King's officer at Modin", classification: unnamed_person, identity_status: unnamed_unique, aliases: [], gender: male, description: "Royal officer compelling sacrifice at Modin, killed by Mattathias.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 2:25", witness_id: web-1-maccabees}]}
  - {id: lasthenes, entity_type: human, primary_name: "Lasthenes", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Official addressed by Demetrius II as 'kinsman' and 'father' in the letter confirming Jewish privileges.", identity_note: "'Father' in 11:32 is a court honorific, not kinship; no parent link made.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 11:31", witness_id: web-1-maccabees}]}
  - {id: lucius-consul, entity_type: human, primary_name: "Lucius", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Consul of the Romans who wrote to kings and states in favour of the Jews.", identity_note: "Historically probably Lucius Caecilius Metellus or Lucius Calpurnius Piso (c. 139 BC).", citations: [{source_id: world-english-bible, locator: "1 Maccabees 15:16", witness_id: web-1-maccabees}]}
  - {id: lysias, entity_type: human, primary_name: "Lysias", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Nobleman of royal lineage left in charge of the kingdom and of young Antiochus; campaigned against Judas and became regent for Eupator; killed by the army under Demetrius.", identity_note: "Called the king's 'brother' in a royal letter (11:22) as a court title.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 3:32", witness_id: web-1-maccabees}]}
  - {id: mattathias-hasmonean, entity_type: human, primary_name: "Mattathias", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Priest of the course of Joarib living at Modin who killed an apostate and a royal officer and began the revolt; died in year 146 and was buried at Modin.", identity_note: "'Of the sons of Joarib' (2:1; 14:29) names his priestly course/ancestral house (Jehoiarib), not his father.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 2:1", witness_id: web-1-maccabees}]}
  - {id: mattathias-son-of-absalom, entity_type: human, primary_name: "Mattathias", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Captain who stood firm with Jonathan at the battle of Hazor.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 11:70", witness_id: web-1-maccabees}]}
  - {id: mattathias-son-of-simon, entity_type: human, primary_name: "Mattathias", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Son of Simon, murdered with his father and brother at the banquet in Dok near Jericho.", identity_note: "Distinct from his grandfather Mattathias and from Mattathias son of Absalom.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 16:14", witness_id: web-1-maccabees}]}
  - {id: mattathias-wife-1ma, entity_type: human, primary_name: "Mother of Simon (wife of Mattathias)", classification: unnamed_person, identity_status: unnamed_unique, aliases: [], gender: female, description: "Mother of Simon (and wife of Mattathias), for whom Simon set up one of the seven pyramids at Modin.", identity_note: "Only 'his mother' in Simon's monument; that she was Mattathias' wife is inferred from 'his father, his mother' in the same verse. Not explicitly said to be mother of all five brothers.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 13:28", witness_id: web-1-maccabees}]}
  - {id: nicanor-1ma, entity_type: human, primary_name: "Nicanor", classification: named_person, identity_status: named, aliases: ["the thrice-accursed wretch"], gender: male, description: "One of the king's friends sent against Judea; later sent by Demetrius I, threatened the temple, and fell at Adasa on 13 Adar, where his head and hand were displayed.", identity_note: "3:38 (under Lysias) and 7:26 (under Demetrius I) are taken as the same man, as is usual; the text does not state it explicitly. See identity_note on nicanor-son-of-patroclus. The festival of 13 Adar commemorates his defeat (15:36). Nicanor of 1 Maccabees 7 and the governor Nicanor of 2 Maccabees 14-15 are identified by the shared 13 Adar defeat and 'Nicanor's Day'; editorial.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 3:38", witness_id: web-1-maccabees}]}
  - {id: numenius, entity_type: human, primary_name: "Numenius", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Envoy sent by Jonathan to Rome and Sparta, later by Simon to Rome with a gold shield.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 12:16", witness_id: web-1-maccabees}]}
  - {id: odomera, entity_type: human, primary_name: "Odomera", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Leader struck down with his kindred by Jonathan during Bacchides' siege of Bethbasi.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 9:66", witness_id: web-1-maccabees}]}
  - {id: onias-i, entity_type: human, primary_name: "Onias", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Earlier high priest who received a letter of kinship from Arius king of the Spartans.", identity_note: "Historically Onias I (c. 300 BC) if Arius is Areus I; some identify Onias III. Kept as one person.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 12:7", witness_id: web-1-maccabees}]}
  - {id: perseus-macedon, entity_type: human, primary_name: "Perseus", classification: named_person, identity_status: named, aliases: [], gender: male, description: "King of Chittim (Macedonia) defeated by the Romans.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 8:5", witness_id: web-1-maccabees}]}
  - {id: philip-friend-of-antiochus-iv, entity_type: human, primary_name: "Philip", classification: named_person, identity_status: named, aliases: [], gender: male, description: "One of Antiochus Epiphanes' friends, appointed over the kingdom and guardian of his son; returned to seize Antioch and was defeated there by Lysias and the king.", identity_note: "Distinct from Philip II (father of Alexander) and Philip V (8:5). His fate after 6:63 is not stated.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 6:14", witness_id: web-1-maccabees}]}
  - {id: philip-ii-macedon, entity_type: human, primary_name: "Philip", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Father of Alexander the Macedonian (Philip II of Macedon).", identity_note: "Distinct from Philip king of Chittim defeated by Rome (8:5, Philip V) and Philip the friend of Antiochus IV (6:14).", citations: [{source_id: world-english-bible, locator: "1 Maccabees 1:1", witness_id: web-1-maccabees}]}
  - {id: philip-v-macedon, entity_type: human, primary_name: "Philip", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Macedonian king defeated by the Romans (Philip V).", citations: [{source_id: world-english-bible, locator: "1 Maccabees 8:5", witness_id: web-1-maccabees}]}
  - {id: ptolemy-son-of-abubus, entity_type: human, primary_name: "Ptolemy", classification: named_person, identity_status: named, aliases: ["the son of Abubus"], gender: male, description: "Governor of the plain of Jericho and son-in-law of Simon, who murdered Simon and two of his sons at a banquet in Dok and tried to kill John.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 16:11", witness_id: web-1-maccabees}]}
  - {id: ptolemy-son-of-dorymenes, entity_type: human, primary_name: "Ptolemy", classification: named_person, identity_status: named, aliases: ["Ptolemy son of Dorymenes"], gender: male, description: "Son of Dorymenes, one of the king's friends chosen by Lysias with Nicanor and Gorgias to invade Judea.", identity_note: "6:8 ('by the suggestion of Ptolemy') and 8:8-9 ('Ptolemy, the governor of Coelesyria and Phoenicia') are assigned here because 1 Macc 3:38 names Ptolemy son of Dorymenes as this governor; the identification is inferential. Kept separate from Ptolemy Macron (10:12), though some scholars equate them.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 3:38", witness_id: web-1-maccabees}]}
  - {id: ptolemy-vi-philometor, entity_type: human, primary_name: "Ptolemy", classification: named_person, identity_status: named, aliases: ["Ptolemy king of Egypt", "King Ptolemy", "Philometor", "Ptolemy Philometor"], gender: male, description: "King of Egypt defeated by Antiochus Epiphanes; later gave his daughter Cleopatra to Alexander, then to Demetrius II, took Antioch and the crown of Asia, and died three days after Alexander's death.", identity_note: "1:18 and 10:51-11:18 are both Ptolemy VI Philometor historically (reigned c. 180-145 BC); merged. Distinct from the King Ptolemy addressed by Lucius (15:16) and from Ptolemy son of Dorymenes / son of Abubus. 1:10 'King Ptolemy' (pupil of Aristobulus) is traditionally Ptolemy VI Philometor; merged with the named Philometor of 4:21, 9:29, 10:13. Same new_id used in 4MA 4:22. Unnamed epithet here; mapped to Ptolemy VI Philometor (same id as 2MA) by historical context.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 1:18", witness_id: web-1-maccabees}]}
  - {id: ptolemy-viii-1ma, entity_type: human, primary_name: "Ptolemy", classification: named_person, identity_status: named, aliases: ["King Ptolemy"], gender: male, description: "King of Egypt to whom the Roman consul Lucius addressed his letter on behalf of the Jews.", identity_note: "Historically Ptolemy VIII Euergetes II (c. 139 BC); distinct from Ptolemy VI who died at 11:18.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 15:16", witness_id: web-1-maccabees}]}
  - {id: seleucus-iv-philopator, entity_type: human, primary_name: "Seleucus", classification: named_person, identity_status: named, aliases: ["King Seleucus", "Seleucus Nicanor"], gender: male, description: "Father of Demetrius I (Seleucus IV Philopator).", identity_note: "Seleucus IV. Father of Demetrius I (14:1). Same new_id used in 4MA. 3:20 'Seleucus Nicanor' (i.e. Nicator, the dynasty's founder's epithet) is applied by the author to the king of Onias' time, Seleucus IV; mapped to seleucus-iv-philopator (same id as 2MA).", citations: [{source_id: world-english-bible, locator: "1 Maccabees 7:1", witness_id: web-1-maccabees}]}
  - {id: seron, entity_type: human, primary_name: "Seron", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Commander of the army of Syria defeated by Judas at the ascent of Beth-horon.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 3:13", witness_id: web-1-maccabees}]}
  - {id: simeon-grandfather-of-mattathias, entity_type: human, primary_name: "Simeon", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Grandfather of the priest Mattathias of Modin; named only in his genealogy.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 2:1", witness_id: web-1-maccabees}]}
  - {id: simon-daughter-1ma, entity_type: human, primary_name: "Daughter of Simon (wife of Ptolemy son of Abubus)", classification: unnamed_person, identity_status: unnamed_unique, aliases: [], gender: female, description: "Simon's daughter, implied by the statement that Ptolemy son of Abubus was the high priest's son-in-law.", identity_note: "Not mentioned directly; inferred only from 'son-in-law' in 16:12.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 16:12", witness_id: web-1-maccabees}]}
  - {id: simon-thassi, entity_type: human, primary_name: "Simon", classification: named_person, identity_status: named, aliases: ["Thassi"], gender: male, description: "Son of Mattathias called Thassi; succeeded Jonathan as leader, became high priest and ethnarch, took the Jerusalem citadel, and was murdered at Dok near Jericho by his son-in-law Ptolemy son of Abubus.", identity_note: "Brother of Judas (8:22, 14:17). 10:19-20 Simon is presumed the same. Reviewer: reconcile id with the 1MA census (Simon Thassi).", citations: [{source_id: world-english-bible, locator: "1 Maccabees 2:3", witness_id: web-1-maccabees}]}
  - {id: timotheus-1ma, entity_type: human, primary_name: "Timotheus", classification: named_person, identity_status: named, aliases: ["Timothy"], gender: male, description: "Leader of the Ammonite force and of the Gentile army in Gilead, defeated by Judas.", identity_note: "5:6 (Ammon) and 5:11-40 (Gilead) are treated as one man; 1 Maccabees has no other Timothy. Possible distinctions from the Timothy/Timotheus figures of 2 Maccabees are left for cross-book review.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 5:6", witness_id: web-1-maccabees}]}
  - {id: tribute-collector-1ma1, entity_type: human, primary_name: "Chief collector of tribute", classification: unnamed_person, identity_status: unnamed_unique, aliases: [], gender: male, description: "Royal tax official sent by Antiochus IV two years after the temple plunder, who attacked Jerusalem treacherously.", identity_note: "Unnamed in 1 Maccabees; 2 Maccabees 5:24 names an Apollonius for a similar mission, but no merge is made here.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 1:29", witness_id: web-1-maccabees}]}
  - {id: trypho, entity_type: human, primary_name: "Tryphon", classification: named_person, identity_status: named, aliases: ["Trypho"], gender: male, description: "Former partisan of Alexander who championed the boy Antiochus, captured and killed Jonathan, murdered Antiochus VI and reigned in his place, and was besieged at Dor by Antiochus VII before fleeing to Orthosia.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 11:39", witness_id: web-1-maccabees}]}
  - {id: zabdiel-arabian, entity_type: human, primary_name: "Zabdiel", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Arabian who beheaded the fugitive Alexander and sent his head to Ptolemy.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 11:17", witness_id: web-1-maccabees}]}
  - {id: zacharias-father-of-joseph-1ma, entity_type: human, primary_name: "Zacharias", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Father of Joseph, one of the commanders left in Judea.", citations: [{source_id: world-english-bible, locator: "1 Maccabees 5:18", witness_id: web-1-maccabees}]}
