schema_version: 1
record_type: entities
records:
  - {id: eleazar-sirach, entity_type: human, primary_name: "Eleazar", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Name attached to Sirach in the author's self-designation; exact relationship unclear.", identity_note: "Greek 'son of Sirach Eleazar' is ambiguous: Eleazar may be Sirach's father (task brief reads 'son of Sirach son of Eleazar'), an ancestor, or a second name of Sirach. No parent link asserted; reviewer may merge as an alias of Sirach or link as Sirach's father.", citations: [{source_id: world-english-bible, locator: "Sirach 50:27", witness_id: web-sirach}]}
  - {id: jesus-son-of-sirach, entity_type: human, primary_name: "Jesus", classification: named_person, identity_status: named, aliases: ["Jesus the son of Sirach Eleazar"], gender: male, description: "Author of the book, a teacher of wisdom from Jerusalem.", identity_note: "WEB 50:27 reads 'I Jesus, the son of Sirach Eleazar, of Jerusalem'. Parent link to Sirach is from this verse; how Eleazar fits (Sirach's own second name, Sirach's father, or an ancestor) is unclear in the Greek. The Hebrew (MS B) gives a longer chain (Simeon son of Jeshua son of Eleazar ben Sira). The first-person speaker of ch. 51 is presumably the same man but is not named there. The grandson-translator and the 'grandfather' wording come from the Greek prologue, which is absent from this WEB VPL file.", citations: [{source_id: world-english-bible, locator: "Sirach 50:27", witness_id: web-sirach}]}
  - {id: onias-father-of-simon-sir, entity_type: human, primary_name: "Onias", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Father of Simon the high priest.", identity_note: "Usually identified as Onias II; may need merging with an Onias entry from the Maccabees census if one is created (the Onias of 1MA 12 / 2MA 3-4 are other individuals).", citations: [{source_id: world-english-bible, locator: "Sirach 50:1", witness_id: web-sirach}]}
  - {id: sirach-father-of-jesus, entity_type: human, primary_name: "Sirach", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Father (or family name) of Jesus, the author of the book.", identity_note: "'Sirach' may be a family name rather than the literal father; kept as the stated parent per 50:27. Not linked to Eleazar because the relation is not stated unambiguously.", citations: [{source_id: world-english-bible, locator: "Sirach 50:27", witness_id: web-sirach}]}
