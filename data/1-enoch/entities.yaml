records:
  - {id: betenos, entity_type: human, primary_name: "Wife of Lamech", classification: unnamed_person, identity_status: unnamed_unique, aliases: ["Bêtênôs", "Betenos"], gender: female, description: "Wife whom Methuselah took for Lamech; mother of Noah.", identity_note: "Unnamed in 1 Enoch; Jubilees 4:28 names Lamech's wife Bêtênôs - the new_id \"betenos\" matches JUB.json. Described as daughter of \"his father's brother\".", citations: [{source_id: charles-enoch-1917, locator: "1 Enoch 106:1", witness_id: charles-1-enoch-translation}]}
  - {id: edni-enoch-wife, entity_type: human, primary_name: "Edna", classification: named_person, identity_status: named, aliases: ["Ednî (Jubilees 4:20)", "Ednî", "Edni"], gender: female, description: "Wife of Enoch and mother of Methuselah.", identity_note: "85:3 \"Before I took thy mother Edna\" (Enoch to Methuselah); 83:2 \"before I took thy mother\". Same person as Ednî daughter of Dânêl in Jubilees 4:20; the new_id matches the one used in JUB.json. Charles spells Ednî here (Enoch's wife) vs Ednâ (Methuselah's wife, 4:27); his footnote compares \"Edna in 1 Enoch lxxxv. 3\" (where Edna is Enoch's wife). Described as daughter of \"his father's brother\".", citations: [{source_id: charles-enoch-1917, locator: "1 Enoch 83:2", witness_id: charles-1-enoch-translation}]}
  - {id: midwife-at-noahs-birth, entity_type: human, primary_name: "Midwife at Noah's birth", classification: unnamed_person, identity_status: unnamed_unique, aliases: [], gender: female, description: "Midwife in whose hands the newborn Noah arose and spoke.", citations: [{source_id: charles-enoch-1917, locator: "1 Enoch 106:3", witness_id: charles-1-enoch-translation}]}
