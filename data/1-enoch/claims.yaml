  - {id: 1-enoch-dated-60-1-date, subject_id: 1-enoch-dated-60-1, predicate: event_date_in_text, value: {kind: "relative_date"}, evidence_type: explicit_text, witness_id: charles-1-enoch-translation, confidence: B, interpretation_note: "Year of a person's life, not a jubilee date. Charles marks \"Enoch\" as corrupt (+...+); this section belongs to the Book of Noah and the year 500 fits Noah (cf. Gen 5:32). Not convertible to A.M. without assuming Noah's birth year.", citations: [{source_id: charles-enoch-1917, locator: "1 Enoch 60:1", witness_id: charles-1-enoch-translation}]}
  - {id: 1-enoch-dated-93-3-date, subject_id: 1-enoch-dated-93-3, predicate: event_date_in_text, value: {kind: "relative_date"}, evidence_type: explicit_text, witness_id: charles-1-enoch-translation, confidence: B, interpretation_note: "\"Week\" here is one of the ten world-weeks of the Apocalypse of Weeks (93:3-10, 91:12-17), not a seven-year week of years; \"seventh\" is his generation from Adam.", citations: [{source_id: charles-enoch-1917, locator: "1 Enoch 93:3", witness_id: charles-1-enoch-translation}]}
