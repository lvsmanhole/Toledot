schema_version: 1
record_type: entities
records:
  - {id: achiacharus, entity_type: human, primary_name: "Achiacharus", classification: named_person, identity_status: named, aliases: ["Manasses"], gender: male, description: "Tobit's nephew, chief officer of Sarchedonus, who supported Tobit; the Ahiqar of the Aramaic wisdom tale.", identity_note: "Son of Tobit's brother Anael (1:21-22). \"Manasses\" in 14:10 (\"Manasses gave alms, and escaped the snare of death which he set for him\") is widely taken as a scribal corruption for Achiacharus (Sinaiticus reads Ahikar there); treated as an alias, not a separate person. Reviewer should confirm.", citations: [{source_id: world-english-bible, locator: "Tobit 1:21", witness_id: web-tobit}]}
  - {id: aduel-tobit, entity_type: human, primary_name: "Aduel", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Tobit's great-grandfather in the Naphtalite genealogy.", citations: [{source_id: world-english-bible, locator: "Tobit 1:1", witness_id: web-tobit}]}
  - {id: ahasuerus-tobit, entity_type: human, primary_name: "Ahasuerus", classification: named_person, identity_status: named, aliases: [], gender: male, description: "King credited, with Nebuchadnezzar, with the destruction of Nineveh.", identity_note: "Not the Ahasuerus (Xerxes) of Esther; usually understood as Cyaxares of Media. Possibly the same Median figure as ahasuerus-dan9, but not asserted.", citations: [{source_id: world-english-bible, locator: "Tobit 14:15", witness_id: web-tobit}]}
  - {id: aman-tobit, entity_type: human, primary_name: "Aman", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Man raised by Achiacharus who betrayed him and perished in his own snare.", identity_note: "Not Haman of Esther: this is the treacherous adopted son/nephew of Ahiqar (Nadin/Nadab in other versions). Text: \"Aman ... Achiacharus who nourished him\" (14:10).", citations: [{source_id: world-english-bible, locator: "Tobit 14:10", witness_id: web-tobit}]}
  - {id: anael-tobit, entity_type: human, primary_name: "Anael", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Tobit's brother, father of Achiacharus.", identity_note: "\"my brother Anael\" (1:21); parentage not stated, so no parent link to Tobiel is recorded.", citations: [{source_id: world-english-bible, locator: "Tobit 1:21", witness_id: web-tobit}]}
  - {id: ananias-son-of-shemaiah, entity_type: human, primary_name: "Ananias", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Israelite kinsman known to Tobit, whose son Raphael claimed to be.", identity_note: "Raphael, disguised, calls himself \"Azarias, the son of Ananias the great\" (5:12); Azarias is the angel's assumed name and is excluded, but Ananias himself is treated by Tobit as a real kinsman (5:13).", citations: [{source_id: world-english-bible, locator: "Tobit 5:12", witness_id: web-tobit}]}
  - {id: ananiel-tobit, entity_type: human, primary_name: "Ananiel", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Tobit's grandfather in the Naphtalite genealogy.", citations: [{source_id: world-english-bible, locator: "Tobit 1:1", witness_id: web-tobit}]}
  - {id: anna-tobit, entity_type: human, primary_name: "Anna", classification: named_person, identity_status: named, aliases: [], gender: female, description: "Wife of Tobit and mother of Tobias; a weaver.", citations: [{source_id: world-english-bible, locator: "Tobit 1:9", witness_id: web-tobit}]}
  - {id: deborah-tobit, entity_type: human, primary_name: "Deborah", classification: named_person, identity_status: named, aliases: [], gender: female, description: "Tobit's paternal grandmother, who taught him the tithe laws.", identity_note: "Mother of Tobiel per 1:8 (\"my father's mother\"); her husband is not named (presumably Ananiel, but not stated).", citations: [{source_id: world-english-bible, locator: "Tobit 1:8", witness_id: web-tobit}]}
  - {id: edna-tobit, entity_type: human, primary_name: "Edna", classification: named_person, identity_status: named, aliases: [], gender: female, description: "Wife of Raguel and mother of Sarah.", citations: [{source_id: world-english-bible, locator: "Tobit 7:2", witness_id: web-tobit}]}
  - {id: gabael-ancestor-tobit, entity_type: human, primary_name: "Gabael", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Ancestor of Tobit, father of Aduel.", identity_note: "Different person from Gabael of Rages (Tobit 1:14 etc.), who is a contemporary of Tobit. Text continues \"of the seed of Asiel\", i.e. a descendant of Asiel; the number of intervening generations is not stated, so Asiel is not listed as parent.", citations: [{source_id: world-english-bible, locator: "Tobit 1:1", witness_id: web-tobit}]}
  - {id: gabael-of-rages, entity_type: human, primary_name: "Gabael", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Kinsman in Rages of Media with whom Tobit deposited ten talents of silver.", identity_note: "1:14 calls him \"the brother of Gabrias\" while 4:20 calls him \"the son of Gabrias\"; the WEB text is internally inconsistent here (Greek recensions differ). Parent link taken from 4:20 only; reviewer may wish to drop it.", citations: [{source_id: world-english-bible, locator: "Tobit 1:14", witness_id: web-tobit}]}
  - {id: gabrias, entity_type: human, primary_name: "Gabrias", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Relative (father per 4:20, brother per 1:14) of Gabael of Rages.", citations: [{source_id: world-english-bible, locator: "Tobit 1:14", witness_id: web-tobit}]}
  - {id: jathan-tobit, entity_type: human, primary_name: "Jathan", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Son of Shemaiah, brother of Ananias, a pilgrim companion of Tobit.", citations: [{source_id: world-english-bible, locator: "Tobit 5:13", witness_id: web-tobit}]}
  - {id: nasbas, entity_type: human, primary_name: "Nasbas", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Nephew who came with Achiacharus to Tobias' wedding feast.", identity_note: "11:18 \"Achiacharus and Nasbas his brother's son came\" is ambiguous (\"his\" may be Achiacharus or Tobit); no parent link recorded.", citations: [{source_id: world-english-bible, locator: "Tobit 11:18", witness_id: web-tobit}]}
  - {id: nebuchadnezzar-tobit, entity_type: human, primary_name: "Nebuchadnezzar", classification: named_person, identity_status: named, aliases: [], gender: male, description: "King credited, with Ahasuerus, with the destruction of Nineveh.", identity_note: "Historically Nineveh fell (612 BC) to Nabopolassar of Babylon and Cyaxares of Media; the book names Nebuchadnezzar (Nabopolassar's son). Not mapped to the existing nebuchadnezzar id because the text's referent is historically confused; reviewer may merge if the project prefers name-based mapping.", citations: [{source_id: world-english-bible, locator: "Tobit 14:15", witness_id: web-tobit}]}
  - {id: ninevite-informer-tobit, entity_type: human, primary_name: "The Ninevite informer", classification: unnamed_person, identity_status: unnamed_unique, aliases: [], gender: male, description: "Man of Nineveh who reported to the king that Tobit was burying the dead.", citations: [{source_id: world-english-bible, locator: "Tobit 1:19", witness_id: web-tobit}]}
  - {id: raguel-maidservant-tobit, entity_type: human, primary_name: "Raguel's maidservant", classification: unnamed_person, identity_status: unnamed_unique, aliases: [], gender: female, description: "Maidservant sent by Edna to see whether Tobias had survived the wedding night.", citations: [{source_id: world-english-bible, locator: "Tobit 8:12", witness_id: web-tobit}]}
  - {id: raguel-tobit, entity_type: human, primary_name: "Raguel", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Kinsman of Tobit in Ecbatana, father of Sarah and father-in-law of Tobias.", identity_note: "Calls Tobit \"my cousin\" (7:2) and \"our brother\" (7:4); not the Raguel/Reuel of Exodus.", citations: [{source_id: world-english-bible, locator: "Tobit 3:7", witness_id: web-tobit}]}
  - {id: sarah-daughter-of-raguel, entity_type: human, primary_name: "Sarah", classification: named_person, identity_status: named, aliases: [], gender: female, description: "Only daughter of Raguel of Ecbatana, troubled by the demon Asmodaeus; wife of Tobias.", identity_note: "Previously given to seven husbands, all unnamed, killed by Asmodaeus (3:8, 7:11).", citations: [{source_id: world-english-bible, locator: "Tobit 3:7", witness_id: web-tobit}]}
  - {id: shemaiah-tobit, entity_type: human, primary_name: "Shemaiah", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Kinsman called \"the great\", father of Ananias and Jathan.", identity_note: "Not identified with any Hebrew-Bible Shemaiah.", citations: [{source_id: world-english-bible, locator: "Tobit 5:13", witness_id: web-tobit}]}
  - {id: tobias-son-of-tobit, entity_type: human, primary_name: "Tobias", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Son of Tobit who travels to Media, marries Sarah, and cures his father.", identity_note: "Tobias and Sarah had six sons (14:3), unnamed. 14:15 says he lived to hear of the destruction of Nineveh.", citations: [{source_id: world-english-bible, locator: "Tobit 1:9", witness_id: web-tobit}]}
  - {id: tobiel, entity_type: human, primary_name: "Tobiel", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Tobit's father, of the tribe of Naphtali.", identity_note: "1:8 calls Deborah \"my father's mother\" and says Tobit was orphaned by his father.", citations: [{source_id: world-english-bible, locator: "Tobit 1:1", witness_id: web-tobit}]}
  - {id: tobit-person, entity_type: human, primary_name: "Tobit", classification: named_person, identity_status: named, aliases: [], gender: male, description: "Naphtalite exile in Nineveh, known for almsgiving and burying the dead; father of Tobias.", identity_note: "14:2 also says his sight returned after eight years. Called \"brother\"/\"cousin\" of Raguel (7:2, 7:4); Raguel is \"kinsman\" of Tobias (6:10).", citations: [{source_id: world-english-bible, locator: "Tobit 1:1", witness_id: web-tobit}]}
